<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marmee — Operator Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>  /* ---- Design tokens (audit SP-1…4, TY-1…3) -----------------------------
     One 4pt spacing scale and one type scale. Before this there were 27
     distinct spacing values (66% off any grid) and 43 font sizes. Add new
     values here rather than inline, or the drift comes straight back.        */
  :root{
    --s1:4px;  --s2:8px;   --s3:12px; --s4:16px; --s5:20px;
    --s6:24px; --s7:32px;  --s8:40px; --s9:48px; --s10:64px;
    --t-xs:12px;  --t-sm:14px;  --t-md:16px;  --t-lg:18px; --t-xl:20px;
    --t-2xl:24px; --t-3xl:30px; --t-4xl:36px; --t-5xl:48px;
  }


  :root{
    --pine:#1E3A2E;--pine-deep:#152A21;--ivory:#F6F1E7;--ivory-dim:#EBE3D3;
    --honey:#C8993A;--honey-soft:#E4B968;--honey-deep:#806116;--blush:#E6C6B4;
    --clay:#9D4526;--ink:#15201A;--muted:#5C6B60;--line:#E4DCC9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--ivory);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:500;line-height:1.08;letter-spacing:-0.01em}
  button{font-family:inherit;cursor:pointer}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--honey-soft);display:inline-block;flex-shrink:0}
  .mono-num{font-family:'Fraunces',serif;font-weight:500;font-variant-numeric:tabular-nums}

  /* ===== LOGIN GATE ===== */
  .gate{position:fixed;inset:0;z-index:200;background:var(--pine);display:flex;align-items:center;justify-content:center;padding:var(--s6);overflow:hidden}
  .gate::after{content:"";position:absolute;right:-180px;top:-140px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(228,185,104,0.15),transparent 68%)}
  .gate.hidden{display:none}
  .gate-card{position:relative;background:var(--ivory);border-radius:22px;padding:var(--s8) var(--s8);width:100%;max-width:410px;box-shadow:0 30px 70px rgba(0,0,0,0.3)}
  .gate-logo{font-family:'Fraunces',serif;font-size:var(--t-2xl);font-weight:600;color:var(--pine);letter-spacing:-0.02em;display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s1)}
  .gate-sub{font-size:var(--t-sm);color:var(--muted);margin-bottom:var(--s6)}
  .gate label{display:block;font-weight:600;font-size:var(--t-sm);margin-bottom:var(--s2)}
  .gate input{width:100%;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:var(--t-md);background:#fff;color:var(--ink)}
  .gate input:focus{outline:2px solid var(--honey-soft);border-color:var(--honey)}
  .gate-btn{width:100%;margin-top:var(--s5);background:var(--honey);color:var(--pine-deep);border:none;padding:var(--s3);border-radius:100px;font-weight:700;font-size:var(--t-md);transition:background .18s}
  .gate-btn:hover{background:var(--honey-soft)}
  .gate-hint{margin-top:var(--s4);font-size:var(--t-xs);color:var(--muted);text-align:center;line-height:1.5}
  .gate-hint code{background:var(--ivory-dim);padding:var(--s1) var(--s2);border-radius:6px;font-size:var(--t-xs);color:var(--pine)}

  /* ===== SHELL ===== */
  .shell{display:none;min-height:100vh;min-height:100dvh}
  .shell.open{display:flex}
  .side{width:246px;background:var(--pine);color:var(--ivory);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh}
  .side-logo{font-family:'Fraunces',serif;font-size:var(--t-2xl);font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;gap:var(--s2);padding:var(--s5) var(--s5) var(--s1)}
  .side-tag{font-size:var(--t-xs);letter-spacing:0.14em;text-transform:uppercase;color:rgba(246,241,231,0.5);padding:0 var(--s5) var(--s5) var(--s7);font-weight:600}
  .side-nav{flex:1;padding:var(--s2) var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
  .navi{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s3);border-radius:11px;color:rgba(246,241,231,0.74);background:none;border:none;width:100%;text-align:left;font-size:var(--t-md);font-weight:500;transition:all .15s}
  .navi:hover{background:rgba(246,241,231,0.07);color:var(--ivory)}
  .navi.on{background:rgba(228,185,104,0.16);color:var(--ivory)}
  .navi .ic{width:20px;text-align:center;font-size:var(--t-md);flex-shrink:0}
  .navi .lbl{flex:1}
  .badge{background:var(--clay);color:#fff;font-size:var(--t-xs);font-weight:700;min-width:20px;height:20px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 var(--s1)}
  .navi.on .badge{background:var(--honey)}
  .side-foot{padding:var(--s4);border-top:1px solid rgba(246,241,231,0.12);display:flex;align-items:center;gap:var(--s3)}
  .side-foot .who{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--blush),var(--honey-soft));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--pine-deep);flex-shrink:0}
  .side-foot .whoinfo{flex:1;font-size:var(--t-sm);line-height:1.3}
  .side-foot .whoinfo b{display:block;color:var(--ivory);font-weight:600}
  .side-foot .whoinfo span{color:rgba(246,241,231,0.55);font-size:var(--t-xs)}
  .signout{background:rgba(246,241,231,0.1);border:none;color:rgba(246,241,231,0.8);width:32px;height:32px;border-radius:9px;font-size:var(--t-md)}
  .signout:hover{background:rgba(246,241,231,0.2);color:#fff}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;max-height:100vh;max-height:100dvh;overflow-y:auto}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,241,231,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:var(--s5) var(--s7);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}
  .topbar h1{font-size:var(--t-3xl);color:var(--pine)}
  .topbar .subtitle{font-size:var(--t-sm);color:var(--muted);margin-top:var(--s1)}
  .hamburger{display:none;background:var(--pine);color:var(--ivory);border:none;width:40px;height:40px;border-radius:10px;font-size:var(--t-lg)}
  .content{padding:var(--s7) var(--s7) var(--s10);max-width:1080px;width:100%}
  .view{display:none;animation:fade .3s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ===== CARDS / PRIMITIVES ===== */
  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3);margin-bottom:var(--s7)}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:var(--s4) var(--s4) var(--s4)}
  .stat .k{font-size:var(--t-xs);letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:var(--s2);line-height:1.3;min-height:2.2em}
  .stat .v{font-size:var(--t-4xl);color:var(--pine);line-height:1}
  .stat .v small{font-size:var(--t-md);color:var(--muted)}
  .stat.alert{border-color:rgba(180,85,47,0.4);background:linear-gradient(180deg,rgba(180,85,47,0.05),#fff)}
  .stat.alert .v{color:var(--clay)}
  @media(max-width:1000px){.stat-row{grid-template-columns:repeat(2,1fr)}}

  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:var(--s1) var(--s6) var(--s3);margin-bottom:var(--s5)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s4) 0 var(--s1);gap:var(--s3)}
  .panel-head h3{font-size:var(--t-lg);color:var(--pine)}
  .panel-head .count{font-size:var(--t-sm);color:var(--muted);font-weight:500}

  .row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) 0;border-top:1px solid var(--ivory-dim)}
  .row:first-of-type{border-top:none}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--blush),var(--honey-soft));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--pine-deep);font-size:var(--t-md);flex-shrink:0}
  .avatar.pine{background:var(--pine);color:var(--honey-soft)}
  .rmain{flex:1;min-width:0}
  .rmain .name{font-weight:600;font-size:var(--t-md);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  .rmain .meta{color:var(--muted);font-size:var(--t-sm);margin-top:var(--s1)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
  .tag{font-size:var(--t-xs);background:var(--ivory);border:1px solid var(--line);color:var(--pine);padding:var(--s1) var(--s2);border-radius:100px;font-weight:500}
  .tag.hit{background:rgba(200,153,58,0.14);border-color:transparent;color:var(--honey-deep);font-weight:600}

  .pill{font-size:var(--t-xs);font-weight:700;padding:var(--s1) var(--s3);border-radius:100px;letter-spacing:0.02em;white-space:nowrap}
  .pill.good{background:rgba(30,58,46,0.1);color:var(--pine)}
  .pill.wait{background:rgba(200,153,58,0.18);color:var(--honey-deep)}
  .pill.open{background:rgba(180,85,47,0.12);color:var(--clay)}

  .act{background:var(--pine);color:var(--ivory);border:none;padding:var(--s2) var(--s4);border-radius:100px;font-weight:600;font-size:var(--t-sm);transition:background .16s;white-space:nowrap}
  .act:hover{background:var(--pine-deep)}
  .act.honey{background:var(--honey);color:var(--pine-deep)}
  .act.honey:hover{background:var(--honey-soft)}
  .act.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .act.ghost:hover{border-color:var(--muted);color:var(--ink)}
  .act:disabled{opacity:0.5;cursor:default}

  .empty{text-align:center;color:var(--muted);padding:var(--s7) var(--s5);font-size:var(--t-md)}
  .empty b{display:block;color:var(--pine);font-family:'Fraunces',serif;font-size:var(--t-lg);margin-bottom:var(--s1);font-weight:500}

  /* pipeline */
  .pipe{display:flex;align-items:center;gap:0;margin-top:var(--s3);flex-wrap:wrap}
  .pnode{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);color:var(--muted)}
  .pnode .pd{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--t-xs);flex-shrink:0}
  .pnode.done{color:var(--pine);font-weight:600}
  .pnode.done .pd{background:var(--pine);border-color:var(--pine);color:#fff}
  .pnode.now{color:var(--honey-deep);font-weight:700}
  .pnode.now .pd{border-color:var(--honey);background:rgba(200,153,58,0.18)}
  .pconn{width:22px;height:2px;background:var(--line);margin:0 var(--s1)}
  .pconn.done{background:var(--pine)}

  /* schedule */
  .daygroup{margin-bottom:var(--s5)}
  .dayhead{font-family:'Fraunces',serif;font-size:var(--t-md);color:var(--pine);font-weight:600;padding-bottom:var(--s2);border-bottom:2px solid var(--ivory-dim);margin-bottom:var(--s1);display:flex;justify-content:space-between;align-items:baseline}
  .dayhead span{font-family:'Hanken Grotesk';font-size:var(--t-sm);color:var(--muted);font-weight:500}
  .visit{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--ivory-dim)}
  .visit:first-of-type{border-top:none}
  .vtime{font-family:'Fraunces',serif;font-weight:600;color:var(--pine);font-size:var(--t-md);width:74px;flex-shrink:0}
  .vpair{flex:1;min-width:0}
  .vpair b{font-weight:600}
  .vpair .arrow{color:var(--honey);margin:0 var(--s1)}
  .vpair .vt{color:var(--muted);font-size:var(--t-sm);margin-top:var(--s1)}

  /* ===== DRAWER ===== */
  .scrim{position:fixed;inset:0;background:rgba(21,32,26,0.5);z-index:120;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:440px;max-width:92vw;background:var(--ivory);z-index:130;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,0.2)}
  .drawer.open{transform:none}
  .drawer-head{background:var(--pine);color:var(--ivory);padding:var(--s5) var(--s6);flex-shrink:0}
  .drawer-head .dh-k{font-size:var(--t-xs);letter-spacing:0.12em;text-transform:uppercase;color:var(--honey-soft);font-weight:600;margin-bottom:var(--s2)}
  .drawer-head h3{font-size:var(--t-xl)}
  .drawer-head .dh-sub{color:rgba(246,241,231,0.75);font-size:var(--t-sm);margin-top:var(--s1)}
  .drawer-close{position:absolute;top:18px;right:18px;background:rgba(246,241,231,0.14);border:none;color:var(--ivory);width:32px;height:32px;border-radius:50%;font-size:var(--t-lg)}
  .drawer-close:hover{background:rgba(246,241,231,0.24)}
  .drawer-body{flex:1;overflow-y:auto;padding:var(--s5) var(--s6) var(--s7)}
  .cand{background:#fff;border:1px solid var(--line);border-radius:14px;padding:var(--s4);margin-bottom:var(--s3);transition:border-color .15s}
  .cand:hover{border-color:var(--honey)}
  .cand-top{display:flex;align-items:center;gap:var(--s3)}
  .cand-top .avatar{width:40px;height:40px;font-size:var(--t-md)}
  .cand .cinfo{flex:1;min-width:0}
  .cand .cinfo b{font-weight:600}
  .cand .cinfo .cm{color:var(--muted);font-size:var(--t-sm)}
  .cand .fit{font-size:var(--t-xs);color:var(--honey-deep);font-weight:600;margin:var(--s2) 0}
  .cand .act{width:100%;text-align:center}

  /* ===== TOAST ===== */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--pine-deep);color:var(--ivory);padding:var(--s3) var(--s5);border-radius:100px;font-size:var(--t-md);font-weight:500;z-index:300;opacity:0;transition:all .3s;display:flex;align-items:center;gap:var(--s2);box-shadow:0 14px 40px rgba(0,0,0,0.3);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .dot{background:var(--honey-soft)}

  .demo-note{font-size:var(--t-xs);color:var(--muted);text-align:center;padding:var(--s2) var(--s5) var(--s6)}

  @media(max-width:820px){
    .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .28s}
    .side.show{transform:none}
    .hamburger{display:block}
    .topbar{padding:var(--s4) var(--s4)}
    .content{padding:var(--s5) var(--s4) var(--s10)}
    .topbar h1{font-size:var(--t-2xl)}
  }
  .schedrow{margin-bottom:var(--s3)}
  .schedrow label{display:block;font-weight:600;font-size:var(--t-sm);margin-bottom:var(--s1);color:var(--pine)}
  .schedrow input,.schedrow select{width:100%;padding:var(--s3) var(--s3);border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:var(--t-md);background:#fff;color:var(--ink)}
  .schedrow input:focus,.schedrow select:focus{outline:2px solid var(--honey-soft);border-color:var(--honey)}
  .minibtn{background:var(--ivory);border:1px solid var(--line);color:var(--pine);border-radius:100px;padding:var(--s2) var(--s3);font-family:inherit;font-size:var(--t-sm);font-weight:600;cursor:pointer;white-space:nowrap}
  .minibtn:hover{border-color:var(--honey)}
  .minibtn.done{background:var(--pine);color:var(--ivory);border-color:var(--pine)}
  .sched-add{background:var(--honey);color:var(--pine-deep);border:none;border-radius:100px;padding:var(--s3) var(--s5);font-family:inherit;font-weight:700;font-size:var(--t-sm);cursor:pointer;margin-bottom:var(--s4)}
  .sched-add:hover{background:var(--honey-soft)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ================= LOGIN GATE ================= -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-logo"><span class="dot"></span>Marmee</div>
    <div class="gate-sub">Operator console — internal access only</div>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username"
           onkeydown="if(event.key==='Enter')document.getElementById('pass').focus()">
    <label for="pass" style="margin-top:14px">Password</label>
    <input id="pass" type="password" placeholder="Your password" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')login()">
    <button class="gate-btn" id="loginBtn" onclick="login()">Sign in</button>
    <div id="loginErr" style="display:none;margin-top:14px;color:var(--clay);font-size:var(--t-sm);font-weight:600;text-align:center"></div>
    <div class="gate-hint">This is the private cockpit for you and your sister — Moms and Marms never see it.</div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="side-logo"><span class="dot"></span>Marmee</div>
    <div class="side-tag">Operator</div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="whoAva">·</div>
      <div class="whoinfo"><b id="whoName">—</b><span>Operator</span></div>
      <button class="signout" onclick="signout()" title="Sign out">⏻</button>
    </div>
  </aside>

  <div class="main" id="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="hamburger" onclick="toggleSide()">☰</button>
        <div>
          <h1 id="vTitle">Overview</h1>
          <div class="subtitle" id="vSub">A quick read on the beta this week.</div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="view on" id="view-overview"></div>
      <div class="view" id="view-requests"></div>
      <div class="view" id="view-moms"></div>
      <div class="view" id="view-families"></div>
      <div class="view" id="view-schedule"></div>
      <div class="demo-note" id="demoNote">Live · saved to your Marmee database.</div>
    </div>
  </div>
</div>

<!-- ================= MATCH DRAWER ================= -->
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <button class="drawer-close" onclick="closeDrawer()">×</button>
    <div class="dh-k">Assign a Marm</div>
    <h3 id="drTitle">—</h3>
    <div class="dh-sub" id="drSub">—</div>
  </div>
  <div class="drawer-body" id="drBody"></div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
/* ================= CONNECTION ================= */
const SUPABASE_URL = 'https://dlargnwijzrlruaxzsgj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RvdH1vqVRoxvL-gnXwGHkw_1CcRTpLg';
const RATE = 28, FEE = 0.15;
let db = null;
if (window.supabase && window.supabase.createClient) {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

const NAV = [
  {id:'overview', ic:'◵', label:'Overview'},
  {id:'requests', ic:'✎', label:'Requests'},
  {id:'moms',     ic:'❖', label:'Marms'},
  {id:'families', ic:'♡', label:'Moms'},
  {id:'schedule', ic:'▤', label:'Schedule'},
];
const SUBS = {
  overview:'A quick read on the beta this week.',
  requests:'New Mom requests waiting for a match.',
  moms:'Your Marm roster and everyone in vetting.',
  families:'The Moms you serve.',
  schedule:'Every upcoming visit, by day.',
};
const STAGES = ['Applied','References','Background check','Welcome call'];

let state = { moms:[], families:[], requests:[], visits:[], matches:[] };
const $ = s => document.querySelector(s);

/* ================= HELPERS ================= */
const momName = m => (m.first_name + ' ' + (m.last_initial||'')).trim();
const famById = id => state.families.find(f=>f.id===id);
const famName = id => { const f=famById(id); return f ? f.name : '—'; };
const initials = txt => { const p=(txt||'').replace(/^The /,'').trim().split(' '); return ((p[0]||'')[0]||'') + ((p[1]||'')[0]||''); };
const openReqs = () => state.requests.filter(r=>r.status==='open');
const activeMoms = () => state.moms.filter(m=>m.status==='active');
const pendingMoms = () => state.moms.filter(m=>m.status==='new'||m.status==='vetting');
const momFamilyCount = id => new Set(state.visits.filter(v=>v.mom_id===id).map(v=>v.family_id)).size;
const matchFor = reqId => state.matches.find(mt=>mt.request_id===reqId);
function fmtDay(d){
  if(!d) return 'Scheduled';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function arr(a){ return Array.isArray(a) ? a : (a ? String(a).replace(/[{}"]/g,'').split(',').filter(Boolean) : []); }

let toastTimer;
function toast(msg){ $('#toastMsg').textContent=msg; $('#toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2800); }

/* ================= AUTH ================= */

// ER-1: never show a raw backend string to a person.
const AUTH_MESSAGES = {
  'Invalid login credentials': 'That email and password do not match.',
  'Email not confirmed': 'This login has not been confirmed yet.',
  'Email logins are disabled': 'Sign-in is temporarily unavailable. Try again shortly.',
};
function loginErr(msg){ const e=$('#loginErr'); e.textContent=msg; e.style.display=msg?'block':'none'; }

async function login(){
  if(!db){ loginErr('Could not reach the database library. Check your internet and refresh.'); return; }
  const email=$('#email').value.trim(), pass=$('#pass').value;
  if(!email||!pass){ loginErr('Enter your email and password.'); return; }
  const btn=$('#loginBtn'); btn.textContent='Signing in…'; btn.disabled=true; loginErr('');
  try{
    const { data, error } = await withTimeout(
      db.auth.signInWithPassword({ email, password: pass }), 15000);
    if(error){ loginErr(AUTH_MESSAGES[error.message] || 'That didn\u2019t work. Check your details.'); }
    else { await withTimeout(enterApp(data && data.user), 15000); }
  }catch(e){
    loginErr(e && e.message === 'timeout'
      ? 'That took too long. Check your connection and try again.'
      : 'Something went wrong signing in. Try again.');
  }finally{
    btn.textContent='Sign in'; btn.disabled=false;
  }
}

// Never let the sign-in button hang forever on a stalled request.
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}

async function signout(){ if(db) await db.auth.signOut(); $('#shell').classList.remove('open'); $('#gate').classList.remove('hidden'); $('#pass').value=''; }

async function enterApp(signedInUser){
  // Prefer the user object the sign-in already returned. Calling getUser()
  // here can deadlock against the auth lock held by signInWithPassword().
  let user = signedInUser;
  if(!user){
    const { data:{ session } } = await db.auth.getSession();
    user = session && session.user;
  }
  const email = user?.email || 'Operator';
  $('#whoName').textContent = email.split('@')[0];
  $('#whoAva').textContent = (email[0]||'·').toUpperCase();
  $('#gate').classList.add('hidden');
  $('#shell').classList.add('open');
  await loadAll();
  renderAll();
}

/* ================= DATA ================= */
async function loadAll(){
  try{
    const [m,f,r,v,mt] = await Promise.all([
      db.from('moms').select('*').order('created_at',{ascending:true}),
      db.from('families').select('*').order('created_at',{ascending:true}),
      db.from('requests').select('*').order('created_at',{ascending:true}),
      db.from('visits').select('*'),
      db.from('matches').select('*'),
    ]);
    state.moms = m.data||[]; state.families=f.data||[]; state.requests=r.data||[];
    state.visits=v.data||[]; state.matches=mt.data||[];
    if(m.error||f.error||r.error){ toast('Loaded, but some data was blocked — did the access rules run?'); }
  }catch(e){ toast('Could not load data. Check your connection.'); }
}

/* ================= NAV ================= */
let current='overview';
function buildNav(){
  $('#nav').innerHTML = NAV.map(n=>{
    let badge='';
    if(n.id==='requests' && openReqs().length) badge=`<span class="badge">${openReqs().length}</span>`;
    if(n.id==='moms' && pendingMoms().length) badge=`<span class="badge">${pendingMoms().length}</span>`;
    return `<button class="navi ${n.id===current?'on':''}" onclick="go('${n.id}')">
      <span class="ic">${n.ic}</span><span class="lbl">${n.label}</span>${badge}</button>`;
  }).join('');
}
function go(id){
  current=id;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  $('#view-'+id).classList.add('on');
  $('#vTitle').textContent = NAV.find(n=>n.id===id).label;
  $('#vSub').textContent = SUBS[id];
  $('#side').classList.remove('show');
  buildNav();
  $('#main').scrollTo?.(0,0);
}
function toggleSide(){ $('#side').classList.toggle('show'); }

/* ================= RENDER ================= */
function renderAll(){ buildNav(); renderOverview(); renderRequests(); renderMoms(); renderFamilies(); renderSchedule(); }

function renderOverview(){
  const upcoming = state.visits.filter(v=>v.status==='upcoming'||v.status==='confirmed');
  const est = Math.round(upcoming.reduce((s,v)=> s + (Number(v.hours)||0)*(Number(v.rate)||RATE)*FEE, 0));
  const stats = [
    {k:'Open requests', v:openReqs().length, alert:openReqs().length>0},
    {k:'Active Marms', v:activeMoms().length},
    {k:'In vetting', v:pendingMoms().length, alert:pendingMoms().length>0},
    {k:'Upcoming visits', v:upcoming.length},
    {k:'Est. weekly take', v:`<small>$</small>${est}`},
  ];
  let attn='';
  const oreq=openReqs(), pmoms=pendingMoms();
  if(!oreq.length && !pmoms.length){
    attn = `<div class="empty"><b>All caught up</b>No open requests and no one waiting in vetting.</div>`;
  } else {
    oreq.forEach(r=>{
      attn += `<div class="row">
        <div class="avatar pine">${initials(famName(r.family_id))}</div>
        <div class="rmain"><div class="name">${famName(r.family_id)} <span class="pill open">Needs a Marm</span></div>
          <div class="meta">${r.frequency||''} · ${famById(r.family_id)?.neighborhood||''} · ${arr(r.areas).join(', ')}</div></div>
        <button class="act honey" onclick="openMatch('${r.id}')">Assign</button></div>`;
    });
    pmoms.forEach(m=>{
      const stg = STAGES[m.vetting_stage] || 'Ready';
      attn += `<div class="row">
        <div class="avatar">${initials(momName(m))}</div>
        <div class="rmain"><div class="name">${momName(m)} <span class="pill wait">In vetting</span></div>
          <div class="meta">Next step: ${stg} · ${m.neighborhood||''}</div></div>
        <button class="act" onclick="go('moms')">Review</button></div>`;
    });
  }
  $('#view-overview').innerHTML = `
    <div class="stat-row">
      ${stats.map(s=>`<div class="stat ${s.alert?'alert':''}"><div class="k">${s.k}</div><div class="v mono-num">${s.v}</div></div>`).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Needs your attention</h3><span class="count">${oreq.length+pmoms.length} item${oreq.length+pmoms.length===1?'':'s'}</span></div>
      ${attn}
    </div>`;
}

function renderRequests(){
  const list = state.requests;
  let html = `<div class="panel"><div class="panel-head"><h3>Mom requests</h3>
    <span class="count">${openReqs().length} open · ${list.length-openReqs().length} matched</span></div>`;
  if(!list.length){ html += `<div class="empty"><b>No requests yet</b>New Mom requests will land here.</div>`; }
  list.forEach(r=>{
    const matched = r.status!=='open';
    const mt = matchFor(r.id);
    const mom = mt ? state.moms.find(m=>m.id===mt.mom_id) : null;
    html += `<div class="row">
      <div class="avatar pine">${initials(famName(r.family_id))}</div>
      <div class="rmain">
        <div class="name">${famName(r.family_id)}
          ${matched?`<span class="pill good">Matched${mom?' · '+momName(mom):''}</span>`:`<span class="pill open">Needs a Marm</span>`}</div>
        <div class="meta">${r.frequency||''} · ${famById(r.family_id)?.neighborhood||''} · ${r.preferred_window||''}</div>
        <div class="chips">${arr(r.areas).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
      ${matched
        ? `<button class="act ghost" disabled>Scheduled</button>`
        : `<button class="act honey" onclick="openMatch('${r.id}')">Assign a Marm</button>`}
    </div>`;
  });
  html += `</div>`;
  $('#view-requests').innerHTML = html;
}

function renderMoms(){
  const act=activeMoms(), pend=pendingMoms();
  let html = `<div class="panel"><div class="panel-head"><h3>Active roster</h3><span class="count">${act.length} Marm${act.length===1?'':'s'}</span></div>`;
  if(!act.length){ html += `<div class="empty"><b>No active Marms yet</b>Approved Marms will appear here.</div>`; }
  act.forEach(m=>{
    const fc = momFamilyCount(m.id);
    html += `<div class="row">
      <div class="avatar">${initials(momName(m))}</div>
      <div class="rmain">
        <div class="name">${momName(m)} <span class="pill good">Active</span></div>
        <div class="meta">${m.rating?('★ '+Number(m.rating).toFixed(1)+' · '):''}${m.neighborhood||''} · ${fc} Mom${fc===1?'':'s'}${m.times_available?(' · '+arr(m.times_available).join(', ')):''}</div>
        <div class="chips">${arr(m.areas).map(s=>`<span class="tag">${s}</span>`).join('')}</div>
      </div></div>`;
  });
  html += `</div>`;
  html += `<div class="panel"><div class="panel-head"><h3>In vetting</h3><span class="count">${pend.length} applicant${pend.length===1?'':'s'}</span></div>`;
  if(!pend.length){ html += `<div class="empty"><b>Nobody waiting</b>New applicants from the Marm sign-up show up here.</div>`; }
  pend.forEach(m=>{
    const stage = m.vetting_stage||0;
    const atEnd = stage >= STAGES.length-1;
    let pipe='<div class="pipe">';
    STAGES.forEach((s,i)=>{
      const cls = i<stage?'done':(i===stage?'now':'');
      pipe += `<div class="pnode ${cls}"><span class="pd">${i<stage?'✓':''}</span>${s}</div>`;
      if(i<STAGES.length-1) pipe += `<div class="pconn ${i<stage?'done':''}"></div>`;
    });
    pipe+='</div>';
    html += `<div class="row" style="align-items:flex-start">
      <div class="avatar">${initials(momName(m))}</div>
      <div class="rmain">
        <div class="name">${momName(m)} <span class="pill wait">${m.status==='new'?'New applicant':'Vetting'}</span></div>
        <div class="meta">${m.neighborhood||''}${m.times_available?(' · '+arr(m.times_available).join(', ')):''}</div>
        ${pipe}
      </div>
      <button class="act" onclick="advance('${m.id}')">${atEnd?'Activate':'Mark '+STAGES[stage+1]+' done'}</button>
    </div>`;
  });
  html += `</div>`;
  $('#view-moms').innerHTML = html;
}

function renderFamilies(){
  let html = `<div class="panel"><div class="panel-head"><h3>Your Moms</h3><span class="count">${state.families.length} households</span></div>`;
  if(!state.families.length){ html += `<div class="empty"><b>No Moms yet</b>Add them here or they arrive from the Mom app.</div>`; }
  state.families.forEach(f=>{
    const v = state.visits.filter(x=>x.family_id===f.id);
    const mom = v.length ? state.moms.find(m=>m.id===v[0].mom_id) : null;
    const planTag = mom ? `<span class="tag hit">With ${momName(mom)}</span>` : `<span class="tag">No Marm yet</span>`;
    html += `<div class="row">
      <div class="avatar pine">${initials(f.name)}</div>
      <div class="rmain">
        <div class="name">${f.name} <span class="pill ${f.status==='active'?'good':'wait'}">${f.status==='active'?'Active':'Lead'}</span></div>
        <div class="meta">${f.neighborhood||''}${f.household?(' · '+f.household):''}${f.joined_at?(' · Joined '+fmtDay(f.joined_at)):''}</div>
        <div class="chips">${planTag}</div>
      </div></div>`;
  });
  html += `</div>`;
  $('#view-families').innerHTML = html;
}

function renderSchedule(){
  const today = new Date().toISOString().slice(0,10);
  const vis = [...state.visits].filter(v=>v.status!=='cancelled')
    .sort((a,b)=> (a.visit_date||'zzzz').localeCompare(b.visit_date||'zzzz') || (a.visit_time||'').localeCompare(b.visit_time||''));
  let html = `<button class="sched-add" onclick="openScheduler()">＋ Schedule a visit</button>`;
  if(!vis.length){ html += `<div class="panel"><div class="empty"><b>No visits scheduled</b>Match a Mom, then schedule their visits here.</div></div>`; }

  // FN-1: a visit whose date has passed is not "upcoming". Split the list so
  // nothing sits at the top of the page wearing an Upcoming badge for a week.
  const isOpen = v => (v.status==='upcoming' || v.status==='confirmed');
  const groups = [
    ['Needs attention', vis.filter(v=> v.visit_date && v.visit_date <  today &&  isOpen(v)),
     'These dates have passed. Mark them done, or cancel them.'],
    ['Today',           vis.filter(v=> v.visit_date === today), ''],
    ['Upcoming',        vis.filter(v=> !v.visit_date || v.visit_date > today), ''],
    ['Done',            vis.filter(v=> v.visit_date && v.visit_date <  today && !isOpen(v)), ''],
  ];

  groups.forEach(([title,list,note])=>{
    if(!list.length) return;
    html += `<div class="daygroup"><div class="dayhead">${title} <span>${list.length} visit${list.length===1?'':'s'}</span></div>`;
    if(note) html += `<div style="color:var(--muted);font-size:var(--t-sm);margin:2px 0 10px">${note}</div>`;
    list.forEach(v=>{
      const mom = state.moms.find(m=>m.id===v.mom_id);
      const open = isOpen(v);
      html += `<div class="visit">
        <div class="vtime">${v.visit_time||'—'}</div>
        <div class="vpair"><div><b>${mom?momName(mom):'—'}</b><span class="arrow">→</span>${famName(v.family_id)}</div>
          <div class="vt">${v.visit_date?fmtDay(v.visit_date)+' · ':''}${arr(v.areas).join(' · ')}${v.hours?(' · '+v.hours+' hrs'):''}${v.hours?(' · $'+Math.round(v.hours*(v.rate||RATE))):''}</div></div>
        <div style="display:flex;flex-direction:column;gap:7px;align-items:flex-end">
          <span class="pill ${v.status==='completed'?'good':(v.status==='confirmed'?'good':'wait')}">${v.status.charAt(0).toUpperCase()+v.status.slice(1)}</span>
          ${open ? `<button class="minibtn done" onclick="completeVisit('${v.id}')">✓ Mark done</button>
                    <button class="minibtn" onclick="opResched('${v.id}')">Reschedule</button>
                    <button class="minibtn" onclick="opCancel('${v.id}')">Cancel</button>` : ''}
        </div>
      </div>`;
      // FN-2: no Cancel on a visit that already happened — it has been paid for.
    });
    html += `</div>`;
  });
  $('#view-schedule').innerHTML = html;
}

/* ================= ACTIONS (write to DB) ================= */
let activeReqId=null;
function openMatch(rid){
  activeReqId = rid;
  const r = state.requests.find(x=>x.id===rid);
  $('#drTitle').textContent = famName(r.family_id);
  $('#drSub').textContent = `${r.frequency||''} · ${r.preferred_window||''} · ${arr(r.areas).join(', ')}`;
  const reqAreas = arr(r.areas);
  const cands = activeMoms().map(m=>{
    const hits = reqAreas.filter(t=>arr(m.areas).includes(t));
    return {m, hits};
  }).sort((a,b)=> b.hits.length-a.hits.length || momFamilyCount(a.m.id)-momFamilyCount(b.m.id));
  $('#drBody').innerHTML = cands.length ? cands.map(({m,hits})=>{
    const fc = momFamilyCount(m.id);
    return `<div class="cand">
      <div class="cand-top">
        <div class="avatar">${initials(momName(m))}</div>
        <div class="cinfo"><b>${momName(m)}</b><div class="cm">${m.rating?('★ '+Number(m.rating).toFixed(1)+' · '):''}${m.neighborhood||''} · ${fc} Mom${fc===1?'':'s'} now</div></div>
      </div>
      <div class="fit">${hits.length? `Covers ${hits.length} of ${reqAreas.length} areas`:'Available · no area overlap'}</div>
      <div class="chips" style="margin-bottom:12px">${reqAreas.map(t=>`<span class="tag ${arr(m.areas).includes(t)?'hit':''}">${t}</span>`).join('')}</div>
      <button class="act honey" onclick="pickMom('${m.id}')">Match ${m.first_name} with ${famName(r.family_id)}</button>
    </div>`;
  }).join('') : `<div class="empty"><b>No active Marms yet</b>Approve a Marm in the Marms tab first.</div>`;
  $('#scrim').classList.add('open'); $('#drawer').classList.add('open');
}
function closeDrawer(){ $('#scrim').classList.remove('open'); $('#drawer').classList.remove('open'); }

function pickMom(mid){
  const r = state.requests.find(x=>x.id===activeReqId);
  const m = state.moms.find(x=>x.id===mid);
  window.__pickMid = mid;
  const today = new Date().toISOString().slice(0,10);
  $('#drTitle').textContent = `${momName(m)} → ${famName(r.family_id)}`;
  $('#drSub').textContent = 'Schedule their first visit';
  $('#drBody').innerHTML = `<div class="cand">
    <div class="schedrow"><label>First visit date</label><input type="date" id="svDate" min="${today}"></div>
    <div class="schedrow"><label>Time</label><input type="text" id="svTime" placeholder="9:00 AM"></div>
    <div class="schedrow"><label>Hours</label><input type="number" id="svHours" value="3" min="1" step="0.5"></div>
    <div class="schedrow"><label>Repeat</label><select id="svRepeat" onchange="document.getElementById('svCountRow').style.display=this.value==='one'?'none':'block'"><option value="one">One-time</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option></select></div>
    <div class="schedrow" id="svCountRow" style="display:none"><label>How many visits</label><input type="number" id="svCount" value="4" min="1" max="26"></div>
    <button class="act honey" style="width:100%" onclick="confirmMatch()">Match &amp; schedule visits</button>
    <button class="act ghost" style="width:100%;margin-top:8px" onclick="openMatch(activeReqId)">← Back to Marms</button>
  </div>`;
}

async function confirmMatch(){
  const mid = window.__pickMid;
  const r = state.requests.find(x=>x.id===activeReqId);
  const m = state.moms.find(x=>x.id===mid);
  const date = $('#svDate').value || null;
  const time = ($('#svTime').value||'').trim() || null;
  const hours = parseFloat($('#svHours').value) || 3;
  closeDrawer();
  try{
    await db.from('matches').insert({ request_id:r.id, mom_id:mid, family_id:r.family_id, status:'active' });
    await db.from('requests').update({ status:'matched' }).eq('id', r.id);
    const rep=($('#svRepeat')||{}).value||'one', cnt=($('#svCount')||{}).value||1;
    const dts=genDates(date,rep,cnt); const sid=(dts.length>1&&window.crypto&&crypto.randomUUID)?crypto.randomUUID():null;
    for(const dt of dts){ await db.from('visits').insert({ mom_id:mid, family_id:r.family_id, areas:arr(r.areas), hours, rate:RATE, visit_date:dt, visit_time:time, status:'upcoming', series_id:sid }); }
    await loadAll(); renderAll();
    toast(`${m.first_name} matched with ${famName(r.family_id)}${date?(' · '+fmtDay(date)):''}`);
  }catch(e){ toast('Could not save the match. Did the access rules run?'); }
}

function openScheduler(){
  const seen=new Set(), pairs=[];
  state.matches.forEach(mt=>{ if(mt.family_id&&mt.mom_id){ const k=mt.family_id+'|'+mt.mom_id; if(!seen.has(k)){seen.add(k);pairs.push({family_id:mt.family_id,mom_id:mt.mom_id});} }});
  state.visits.forEach(v=>{ if(v.family_id&&v.mom_id){ const k=v.family_id+'|'+v.mom_id; if(!seen.has(k)){seen.add(k);pairs.push({family_id:v.family_id,mom_id:v.mom_id});} }});
  window.__pairs = pairs;
  const today = new Date().toISOString().slice(0,10);
  $('#drTitle').textContent = 'Schedule a visit';
  $('#drSub').textContent = 'Book a visit for a matched Mom';
  if(!pairs.length){
    $('#drBody').innerHTML = `<div class="empty"><b>No matched Moms yet</b>Match a Mom with a Marm first, then schedule their visits here.</div>`;
  } else {
    const opts = pairs.map((p,i)=>`<option value="${i}">${famName(p.family_id)} → ${momName(state.moms.find(m=>m.id===p.mom_id)||{first_name:'—'})}</option>`).join('');
    $('#drBody').innerHTML = `<div class="cand">
      <div class="schedrow"><label>Mom &amp; Marm</label><select id="svPair">${opts}</select></div>
      <div class="schedrow"><label>Date</label><input type="date" id="svDate" min="${today}"></div>
      <div class="schedrow"><label>Time</label><input type="text" id="svTime" placeholder="9:00 AM"></div>
      <div class="schedrow"><label>Hours</label><input type="number" id="svHours" value="3" min="1" step="0.5"></div>
      <div class="schedrow"><label>Repeat</label><select id="svRepeat" onchange="document.getElementById('svCountRow').style.display=this.value==='one'?'none':'block'"><option value="one">One-time</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option></select></div>
      <div class="schedrow" id="svCountRow" style="display:none"><label>How many visits</label><input type="number" id="svCount" value="4" min="1" max="26"></div>
      <button class="act honey" style="width:100%" onclick="createVisit()">Schedule visit(s)</button>
    </div>`;
  }
  $('#scrim').classList.add('open'); $('#drawer').classList.add('open');
}

async function createVisit(){
  const pairs = window.__pairs||[]; const p = pairs[parseInt($('#svPair').value)||0]; if(!p) return;
  const date = $('#svDate').value || null;
  const time = ($('#svTime').value||'').trim() || null;
  const hours = parseFloat($('#svHours').value) || 3;
  const req = state.requests.find(r=>r.family_id===p.family_id);
  const areas = req ? arr(req.areas) : [];
  closeDrawer();
  try{
    const rep=($('#svRepeat')||{}).value||'one', cnt=($('#svCount')||{}).value||1;
    const dts=genDates(date,rep,cnt); const sid=(dts.length>1&&window.crypto&&crypto.randomUUID)?crypto.randomUUID():null;
    for(const dt of dts){ await db.from('visits').insert({ mom_id:p.mom_id, family_id:p.family_id, areas, hours, rate:RATE, visit_date:dt, visit_time:time, status:'upcoming', series_id:sid }); }
    await loadAll(); renderAll();
    toast(`Visit scheduled${date?(' · '+fmtDay(date)):''}`);
  }catch(e){ toast('Could not schedule. Try again.'); }
}

function genDates(start, repeat, count){
  if(!start) return [null];
  if(repeat==='one'||!repeat) return [start];
  const step = repeat==='biweekly'?14:7;
  const n = Math.max(1, Math.min(parseInt(count)||1, 26));
  const out=[], d0=new Date(start+'T00:00:00');
  for(let i=0;i<n;i++){ const d=new Date(d0.getTime()+i*step*86400000); out.push(d.toISOString().slice(0,10)); }
  return out;
}
async function opCancel(id){
  if(!confirm('Cancel this visit?')) return; const reason=prompt('Reason (optional):')||'';
  try{ await db.from('visits').update({ status:'cancelled', cancel_reason:reason }).eq('id',id); await loadAll(); renderAll(); toast('Visit cancelled'); }
  catch(e){ toast('Could not cancel.'); }
}
async function opResched(id){
  const date=prompt('New date (YYYY-MM-DD):'); if(!date) return; const time=prompt('New time (e.g. 9:00 AM):'); if(!time) return;
  try{ await db.from('visits').update({ visit_date:date, visit_time:time, status:'upcoming' }).eq('id',id); await loadAll(); renderAll(); toast('Visit rescheduled'); }
  catch(e){ toast('Could not reschedule.'); }
}
async function completeVisit(id){
  try{
    await db.from('visits').update({ status:'completed' }).eq('id', id);
    await loadAll(); renderAll();
    toast('Visit marked done — earnings updated');
  }catch(e){ toast('Could not update. Try again.'); }
}

async function advance(mid){
  const m = state.moms.find(x=>x.id===mid);
  const stage = m.vetting_stage||0;
  try{
    if(stage >= STAGES.length-1){
      await db.from('moms').update({ status:'active', vetting_stage:4 }).eq('id', mid);
      await loadAll(); renderAll();
      toast(`${m.first_name} is active and ready to match`);
    } else {
      await db.from('moms').update({ status:'vetting', vetting_stage: stage+1 }).eq('id', mid);
      await loadAll(); renderMoms(); buildNav();
      toast(`${m.first_name}: ${STAGES[stage+1]} cleared`);
    }
  }catch(e){ toast('Could not save that change. Did the access rules run?'); }
}

/* ================= BOOT ================= */
(async function boot(){
  if(!db){ loginErr('Could not load the database library. Check your internet and refresh.'); return; }
  try{
    const { data:{ session } } = await db.auth.getSession();
    if(session){ await enterApp(); }
  }catch(e){}
})();
</script>
