      <div class="schedrow"><label>Time</label><input type="time" id="svTime" step="900"><div class="chips" style="margin-top:var(--s2)"><button type="button" class="timechip" onclick="setTime('08:00')">8:00a</button><button type="button" class="timechip" onclick="setTime('09:00')">9:00a</button><button type="button" class="timechip" onclick="setTime('10:00')">10:00a</button><button type="button" class="timechip" onclick="setTime('12:00')">12:00p</button><button type="button" class="timechip" onclick="setTime('13:00')">1:00p</button><button type="button" class="timechip" onclick="setTime('15:00')">3:00p</button><button type="button" class="timechip" onclick="setTime('17:00')">5:00p</button></div></div>
      <div class="schedrow"><label>Hours</label><input type="number" id="svHours" value="3" min="1" step="0.5"></div>
      <div class="schedrow"><label>Repeat</label><select id="svRepeat" onchange="document.getElementById('svCountRow').style.display=this.value==='one'?'none':'block';showSeriesEnd()"><option value="one">One-time</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option></select></div>
      <div class="schedrow" id="svCountRow" style="display:none"><label>How many visits</label><input type="number" id="svCount" value="4" min="1" max="26" oninput="showSeriesEnd()"><div class="meta" id="svCountHint" style="margin-top:var(--s1)"></div></div>
      <button class="act honey" style="width:100%" onclick="createVisit()">Schedule visit(s)</button>
    </div>`;
  }
  $('#scrim').classList.add('open'); $('#drawer').classList.add('open');
}

async function createVisit(){
  const pairs = window.__pairs||[]; const p = pairs[parseInt($('#svPair').value)||0]; if(!p) return;
  const date = $('#svDate').value || null;
  if(!date){ toast('Pick a date for the first visit.'); return; }
  const rawTime = ($('#svTime').value||'').trim();
  if(!rawTime){ toast('Pick a time — the Marm needs to know when to arrive.'); return; }
  const time = to12h(rawTime);
  const hours = parseFloat($('#svHours').value) || 3;
  // Took the first request for the household regardless of status, so a
  // household with an old closed request got the old request's areas written
  // onto a brand new visit. Prefer the matched or open one, newest first.
  const reqs = state.requests
    .filter(r=>r.family_id===p.family_id)
    .sort((a,b)=> String(b.created_at||'').localeCompare(String(a.created_at||'')));
  const req = reqs.find(r=>r.status==='matched') || reqs.find(r=>r.status==='open') || reqs[0];
  const areas = req ? arr(req.areas) : [];
  closeDrawer();
  try{
    const rep=($('#svRepeat')||{}).value||'one', cnt=($('#svCount')||{}).value||1;
    const dts=genDates(date,rep,cnt); const sid=(dts.length>1&&window.crypto&&crypto.randomUUID)?crypto.randomUUID():null;
    for(const dt of dts){ await must(db.from('visits').insert({ mom_id:p.mom_id, family_id:p.family_id, areas, hours, rate:rateFor(famById(p.family_id)), visit_date:dt, visit_time:time, status:'upcoming', series_id:sid }), 'Booking the visit'); }
    await loadAll(); renderAll();
    toast(`Visit scheduled${date?(' · '+fmtDay(date)):''}`);
  }catch(e){ toast('Could not schedule. Try again.'); }
}

function genDates(start, repeat, count){
  if(!start) return [null];
  if(repeat==='one'||!repeat) return [start];
  const step = repeat==='biweekly'?14:7;
  const n = Math.max(1, Math.min(parseInt(count)||1, 26));
  const out=[], d0=new Date(start+'T00:00:00');
  for(let i=0;i<n;i++){
    const d=new Date(d0.getTime()+i*step*86400000);
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  }
  return out;
}
async function opCancel(id){
  const reason = await askCancelVisit();
  if(reason===null) return;
  try{ await must(db.from('visits').update({ status:'cancelled', cancel_reason:reason }).eq('id',id), 'Cancelling the visit'); await loadAll(); renderAll(); toast('Visit cancelled'); }
  catch(e){ toast('Could not cancel.'); }
}
async function opResched(id){
  const when = await askReschedule();
  if(!when) return;
  const date=when.date, time=when.time;
  try{ await must(db.from('visits').update({ visit_date:date, visit_time:time, status:'upcoming' }).eq('id',id), 'Rescheduling'); await loadAll(); renderAll(); toast('Visit rescheduled'); }
  catch(e){ toast('Could not reschedule.'); }
}
async function retryCharge(id){
  const v = state.visits.find(x=>x.id===id);
  const fam = v ? famById(v.family_id) : null;
  const amount = v ? Math.round((Number(v.hours)||0) * visitRate(v)) : 0;

  if(fam && !fam.payment_method_id){
    toast(`${fam.name || 'That household'} still has no card on file.`);
    return;
  }
  const ok = await askConfirm(
    `Try the card again?`,
    `${fam ? fam.name : 'This household'} · $${amount}. Last time: ${v?.payment_error || 'declined'}`,
    `Charge $${amount}`);
  if(!ok) return;

  try{
    toast('Trying the card…');
    const s = (await db.auth.getSession()).data.session;
    const r = await fetch('/api/stripe-charge-visit', {
      method:'POST', headers:{ 'content-type':'text/plain' },
      body: JSON.stringify({ token: s.access_token, visitId: id })
    });
    const d = await r.json().catch(()=>({}));
    await loadAll(); renderAll();
    if(!r.ok)                    toast(d.error || 'Declined again.');
    else if(d.status === 'paid') toast(`Paid $${(d.amountCents/100).toFixed(2)}.`);
    else                         toast(`Payment ${d.status}. Check Stripe.`);
  }catch(e){ toast('Could not reach the payment service.'); }
}

async function refundVisit(id){
  const v = state.visits.find(x=>x.id===id);
  const fam = v ? famById(v.family_id) : null;
  const amount = v ? ((v.amount_cents||0)/100).toFixed(2).replace(/\.00$/,'') : '0';

  const ok = await askConfirm(
    `Refund $${amount}?`,
    `${fam ? fam.name : 'This household'} gets the full amount back. This cannot be undone from here.`,
    `Refund $${amount}`, true);
  if(!ok) return;

  try{
    const s = (await db.auth.getSession()).data.session;
    const r = await fetch('/api/stripe-refund-visit', {
      method:'POST',
      headers:{ 'content-type':'text/plain' },
      body: JSON.stringify({ token: s.access_token, visitId: id })
    });
    const d = await r.json().catch(()=>({}));
    await loadAll(); renderAll();
    if(!r.ok)                      toast(d.error || 'Could not refund that visit.');
    else if(d.alreadyRefunded)     toast('That visit was already refunded.');
    else                           toast(`Refunded $${(d.amountCents/100).toFixed(2)}.`);
  }catch(e){ toast('Could not refund that visit.'); }
}

async function completeVisit(id){
  const v = state.visits.find(x=>x.id===id);
  if(!v) return;
  const fam  = famById(v.family_id);
  const mom  = state.moms.find(m=>m.id===v.mom_id);
  const rate = visitRate(v);
  const sched = Number(v.hours) || 0;

  // If she checked in and out, that is what happened. Default to it rather
  // than to what was scheduled — the whole point of the timestamps is that
  // nobody has to remember. Rounded to the nearest quarter hour.
  const worked = actualHours(v);
  const prefill = worked !== null ? worked : sched;

  // Ask what actually happened before taking money for what was planned.
  // The scheduled hours are the default, so the common case is one tap.
  const r = await openSheet({
    title: 'Mark this visit done',
    sub: `${mom ? momName(mom) : 'The Marm'} at ${fam ? fam.name : 'this household'} · scheduled ${sched} hours`,
    bodyHTML:
      '<label for="shHours">Hours actually worked</label>' +
      `<input type="number" id="shHours" value="${prefill}" min="0" max="12" step="0.25">` +
      (worked !== null
        ? `<div class="meta" style="margin:calc(-1 * var(--s3)) 0 var(--s4)">She checked in at ${clockTime(v.checked_in_at)} and out at ${clockTime(v.checked_out_at)} — ${worked} hours.</div>`
        : `<div class="meta" style="margin:calc(-1 * var(--s3)) 0 var(--s4);color:var(--clay)">She did not check in or out, so this is the scheduled figure.</div>`) +
      `<div class="meta" id="shCalc" style="margin:calc(-1 * var(--s3)) 0 var(--s4)"></div>`,
    okLabel: 'Mark done',
    cancelLabel: 'Not yet',
    validate: v => (Number(v.shHours) > 0 ? null : 'Enter the hours worked.'),
    // Without this the calculator quoted the fallback rate while the confirmation two
    // taps later quoted the visit's real rate.
    rate,
    marmRate: marmRateOf(v)
  });
  if(!r.ok) return;

  const hours = Math.max(0, Number(r.values.shHours));
  if(!hours){ toast('Enter the hours worked.'); return; }
  const amount = Math.round(hours * rate);

  try{
    // Write the real hours first — the charge function computes the amount
    // from the row, never from anything the browser sends.
    await must(db.from('visits').update({ status:'completed', hours }).eq('id', id), 'Marking the visit done');
  }catch(e){ toast('Could not update that visit.'); return; }

  // No card on file: it is still done, but say plainly that nothing was taken.
  if(fam && !fam.payment_method_id){
    await loadAll(); renderAll();
    toast(`Marked done — $${amount} not collected, no card on file.`);
    return;
  }

  const charge = await askConfirm(
    `Charge $${amount}?`,
    `${fam ? fam.name : 'This household'} for ${hours} hour${hours===1?'':'s'} at $${rate}/hour. ${mom?momName(mom):'The Marm'} keeps $${(amount*(1-0.15)).toFixed(2)}.`,
    `Charge $${amount}`);

  if(!charge){
    await loadAll(); renderAll();
    toast('Marked done. Not charged yet.');
    return;
  }

  try{
    await loadAll(); renderAll();
    toast('Taking payment…');

    const s = (await db.auth.getSession()).data.session;
    const res = await fetch('/api/stripe-charge-visit', {
      method:'POST',
      headers:{ 'content-type':'text/plain' },          // text/plain avoids the CORS preflight
      body: JSON.stringify({ token: s.access_token, visitId: id })
    });
    const d = await res.json().catch(()=>({}));

    await loadAll(); renderAll();

    if(!res.ok)                  toast(d.error || 'Marked done, but the card was declined.');
    else if(d.alreadyCharged)    toast('Already paid — not charged again.');
    else if(d.status === 'paid') toast(`Paid $${(d.amountCents/100).toFixed(2)}.`);
    else                         toast(`Payment ${d.status}. Check Stripe.`);

  }catch(e){ toast('Marked done, but the payment did not go through.'); }
}

async function advance(mid){
  const m = state.moms.find(x=>x.id===mid);
  const stage = m.vetting_stage||0;
  const atEnd = stage >= STAGES.length-1;

  // ACTIVATION GATE. A green "Active" badge tells a Mom this person was
  // checked. That must not be possible to click your way to.
  if(atEnd){
    if(m.bg_check_status !== 'clear'){
      await askConfirm(
        'Background check not recorded',
        `${m.first_name} cannot go active until her background check is marked clear. Use "Background check cleared" on her row.`,
        'I understand', false, 'Close');
      return;
    }
    const ok = await askConfirm(
      `Make ${m.first_name} active?`,
      'She becomes visible for matching, and Moms will be told she is vetted. Only do this if every step above actually happened.',
      'Yes, she is vetted');
    if(!ok) return;

    try{
      await must(db.from('moms').update({ status:'active', vetting_stage:4 }).eq('id', mid), 'Activating her');
      await logVetting(mid, 'Activated', null);
      await loadAll(); renderAll();
      toast(`${m.first_name} is active and ready to match`);
    }catch(e){ toast('Could not save that change.'); }
    return;
  }

  // Each stage records what was actually done, by whom.
  const next = STAGES[stage+1];
  const r = await openSheet({
    title: `${next} — done?`,
    sub: `${m.first_name}. What you write here is kept as the record.`,
    bodyHTML: `<label for="shNote">What happened</label>`
            + `<input id="shNote" placeholder="${next==='References' ? 'Spoke to Megan — glowing' : 'Brief note'}">`,
    okLabel: `Yes, ${next.toLowerCase()} done`,
    cancelLabel: 'Not yet'
  });
  if(!r.ok) return;

  try{
    await must(db.from('moms').update({ status:'vetting', vetting_stage: stage+1 }).eq('id', mid), 'Recording that step');
    await logVetting(mid, next, r.values.shNote || null);
    await loadAll(); renderMoms(); buildNav();
    toast(`${m.first_name}: ${next} recorded`);
  }catch(e){ toast('Could not save that change. Did the access rules run?'); }
}

async function logVetting(momId, stage, note){
  try{
    const { data:{ user } } = await db.auth.getUser();
    await must(db.from('vetting_log').insert({ mom_id: momId, stage, note, completed_by: user?.id || null }), 'Writing the vetting record');
  }catch(e){
    // Silently swallowing this would put us back where we started: a stage
    // that moved with nothing recorded behind it. Say it out loud.
    console.error('vetting log', e);
    toast('The step was saved but the record was not written. Tell Mike.');
  }
}

// The background check is the one step with a real outside answer. It gets
// its own control rather than being a stage you can tab past.
async function markBgClear(mid){
  const m = state.moms.find(x=>x.id===mid);
  const r = await openSheet({
    title: 'Background check cleared',
    sub: `${m.first_name}. Record the reference so this is auditable later.`,
    bodyHTML: '<label for="shRef">Checkr report ID or reference</label>'
            + '<input id="shRef" placeholder="e.g. Checkr 8f2c… or \'clear, 12 Aug\'">',
    okLabel: 'Mark clear',
    validate: v => ((v.shRef||'').trim() ? null : 'Add a reference so this can be checked later.')
  });
  if(!r.ok) return;
  if(!r.values.shRef){ toast('Add a reference so this can be checked later.'); return; }
  try{
    await must(db.from('moms').update({
      bg_check_status: 'clear',
      bg_checked_at: new Date().toISOString(),
      bg_reference: r.values.shRef
    }).eq('id', mid), 'Recording the background check');
    await logVetting(mid, 'Background check', r.values.shRef);
    await loadAll(); renderMoms();
    toast(`${m.first_name}: background check recorded`);
  }catch(e){ toast('Could not save that.'); }
}

  if(!db){ loginErr('Could not load the database library. Check your internet and refresh.'); return; }

    const { data:{ session } } = await db.auth.getSession();

/* ---- ST-1: in-app sheet -------------------------------------------------
   openSheet() resolves {ok, values} where values is keyed by input id.     */
let _sheetRes=null, _sheetValidate=null;
function _sheetErr(msg){
  const e=document.getElementById('sheetErr');
  if(!e) return;
  e.textContent=msg||''; e.style.display=msg?'block':'none';
}
function _sheetClose(ok){
  const body=document.getElementById('sheetBody');
  const values={};
  body.querySelectorAll('input,textarea,select').forEach(el=>{ values[el.id]=el.value; });

  // Validation used to run after the sheet had gone, so a missing field meant
  // reopening it and retyping everything. Say it here, with her answers still
  // on screen, and keep the sheet open.
  if(ok && _sheetValidate){
    const problem = _sheetValidate(values);
    if(problem){ _sheetErr(problem); return; }
  }
  _sheetErr('');
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('sheetScrim').classList.remove('on');
  const r=_sheetRes; _sheetRes=null; _sheetValidate=null;
  if(r) r({ok:!!ok, values});
}
function wireHoursCalc(rate){
  const h = document.getElementById('shHours'), out = document.getElementById('shCalc');
  if(!h || !out) return;
  const paint = () => {
    const n = Math.max(0, Number(h.value) || 0);
    out.textContent = n ? `$${Math.round(n*rate)} charged · $${(n*(_sheetMarmRate||FALLBACK_MARM_RATE)).toFixed(2)} to her` : '';
  };
  h.addEventListener('input', paint); paint();
}
let _sheetMarmRate = null;
function openSheet(o){
  _sheetMarmRate = o.marmRate || null;
  _sheetValidate = o.validate || null;
  _sheetErr('');
  document.getElementById('sheetTitle').textContent=o.title||'';
  const sub=document.getElementById('sheetSub');
  sub.textContent=o.sub||''; sub.style.display=o.sub?'block':'none';
  document.getElementById('sheetBody').innerHTML=o.bodyHTML||'';
  const ok=document.getElementById('sheetOk');
  ok.textContent=o.okLabel||'Confirm';
  ok.classList.toggle('danger', !!o.danger);
  document.getElementById('sheetCancel').textContent=o.cancelLabel||'Never mind';
  document.getElementById('sheetScrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  setTimeout(()=>{ const first=document.querySelector('#sheetBody input,#sheetBody textarea'); if(first) first.focus(); wireHoursCalc(o.rate || RATE); },260);
  return new Promise(res=>{ _sheetRes=res; });
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && _sheetRes) _sheetClose(false); });

async function askConfirm(title, sub, okLabel, danger, cancelLabel){
  const r = await openSheet({title, sub, okLabel:okLabel||'Yes', danger:!!danger, cancelLabel});
  return r.ok;
}
async function askCancelVisit(){
  const r = await openSheet({
    title:'Cancel this visit?',
    sub:'We’ll let the other person know. You can always book another.',
    bodyHTML:'<label for="shReason">Reason — optional</label><input id="shReason" placeholder="Something came up">',
    okLabel:'Cancel the visit', cancelLabel:'Keep it', danger:true });
  return r.ok ? (r.values.shReason||'') : null;
}
async function askReschedule(){
  const today=todayLocal();
  const r = await openSheet({
    title:'Pick a new time',
    sub:'We’ll let the other person know about the change.',
    // Was a free text box. Whatever was typed went straight into the column
    // that Booking fills with to12h() output, so the schedule ended up mixing
    // "9:00a", "9:00 AM" and "morning" — and the sort could not read any of it.
    bodyHTML:'<label for="shDate">New date</label><input type="date" id="shDate" min="'+today+'">'
            +'<label for="shTime">New time</label><input type="time" id="shTime" step="900">'
            +'<div class="chips" style="margin-top:var(--s2)">'
            + ['08:00','09:00','10:00','12:00','13:00','15:00','17:00']
                .map(t=>`<button type="button" class="timechip" onclick="setSheetTime('${t}')">${to12h(t)}</button>`).join('')
            +'</div>',
    okLabel:'Save the change',
    validate: v => (v.shDate && v.shTime ? null : 'Pick both a date and a time.') });
  if(!r.ok) return null;
  if(!r.values.shDate || !r.values.shTime){ toast('Please pick both a date and a time.'); return null; }
  // Stored the way every other visit stores it, so the schedule can sort it.
  return { date:r.values.shDate, time:to12h(r.values.shTime) };
}

/* ---- Password show/hide -------------------------------------------------
   Wraps every password field and adds a Show/Hide button. The input's own
   bottom margin moves to the wrapper so the button stays vertically centred. */
function attachPwToggles(){
  document.querySelectorAll('input[type="password"]').forEach(inp=>{
    if(inp.dataset.pwToggle) return;
    inp.dataset.pwToggle='1';
    const mb = getComputedStyle(inp).marginBottom;
    const wrap=document.createElement('div');
    wrap.className='pw-wrap';
    wrap.style.marginBottom = mb;
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pw-toggle'; b.textContent='Show';
    b.setAttribute('aria-label','Show password');
    b.addEventListener('click', ()=>{
      const hidden = inp.type==='password';
      inp.type = hidden ? 'text' : 'password';
      b.textContent = hidden ? 'Hide' : 'Show';
      b.setAttribute('aria-label', (hidden?'Hide':'Show')+' password');
      inp.focus();
    });
    wrap.appendChild(b);
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', attachPwToggles);
else attachPwToggles();
