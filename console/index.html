<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marmee — Operator Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>  /* ---- Design tokens (audit SP-1…4, TY-1…3) -----------------------------
     One 4pt spacing scale and one type scale. Before this there were 27
     distinct spacing values (66% off any grid) and 43 font sizes. Add new
     values here rather than inline, or the drift comes straight back.        */
  :root{
    --s1:4px;  --s2:8px;   --s3:12px; --s4:16px; --s5:20px;
    --s6:24px; --s7:32px;  --s8:40px; --s9:48px; --s10:64px;
    --t-xs:12px;  --t-sm:14px;  --t-md:16px;  --t-lg:18px; --t-xl:20px;
    --t-2xl:24px; --t-3xl:30px; --t-4xl:36px; --t-5xl:48px;
  }


  :root{
    --pine:#1E3A2E;--pine-deep:#152A21;--ivory:#F6F1E7;--ivory-dim:#EBE3D3;
    --honey:#C8993A;--honey-soft:#E4B968;--honey-deep:#806116;--blush:#E6C6B4;
    --clay:#9D4526;--ink:#15201A;--muted:#5C6B60;--line:#E4DCC9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--ivory);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:500;line-height:1.08;letter-spacing:-0.01em}
  button{font-family:inherit;cursor:pointer}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--honey-soft);display:inline-block;flex-shrink:0}
  .mono-num{font-family:'Fraunces',serif;font-weight:500;font-variant-numeric:tabular-nums}

  /* ===== LOGIN GATE ===== */
  .gate{position:fixed;inset:0;z-index:200;background:var(--pine);display:flex;align-items:center;justify-content:center;padding:var(--s6);overflow:hidden}
  .gate::after{content:"";position:absolute;right:-180px;top:-140px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(228,185,104,0.15),transparent 68%)}
  .gate.hidden{display:none}
  .gate-card{position:relative;background:var(--ivory);border-radius:22px;padding:var(--s8) var(--s8);width:100%;max-width:410px;box-shadow:0 30px 70px rgba(0,0,0,0.3)}
  .gate-logo{font-family:'Fraunces',serif;font-size:var(--t-2xl);font-weight:600;color:var(--pine);letter-spacing:-0.02em;display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s1)}
  .gate-sub{font-size:var(--t-sm);color:var(--muted);margin-bottom:var(--s6)}
  .gate label{display:block;font-weight:600;font-size:var(--t-sm);margin-bottom:var(--s2)}
  .gate input{width:100%;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:var(--t-md);background:#fff;color:var(--ink)}
  .gate input:focus{outline:2px solid var(--honey-soft);border-color:var(--honey)}
  .gate-btn{width:100%;margin-top:var(--s5);background:var(--honey);color:var(--pine-deep);border:none;padding:var(--s3);border-radius:100px;font-weight:700;font-size:var(--t-md);transition:background .18s}
  .gate-btn:hover{background:var(--honey-soft)}
  .gate-hint{margin-top:var(--s4);font-size:var(--t-xs);color:var(--muted);text-align:center;line-height:1.5}
  .gate-hint code{background:var(--ivory-dim);padding:var(--s1) var(--s2);border-radius:6px;font-size:var(--t-xs);color:var(--pine)}

  /* ===== SHELL ===== */
  .shell{display:none;min-height:100vh;min-height:100dvh}
  .shell.open{display:flex}
  .side{width:246px;background:var(--pine);color:var(--ivory);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh}
  .side-logo{font-family:'Fraunces',serif;font-size:var(--t-2xl);font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;gap:var(--s2);padding:var(--s5) var(--s5) var(--s1)}
  .side-tag{font-size:var(--t-xs);letter-spacing:0.14em;text-transform:uppercase;color:rgba(246,241,231,0.5);padding:0 var(--s5) var(--s5) var(--s7);font-weight:600}
  .side-nav{flex:1;padding:var(--s2) var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
  .navi{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s3);border-radius:11px;color:rgba(246,241,231,0.74);background:none;border:none;width:100%;text-align:left;font-size:var(--t-md);font-weight:500;transition:all .15s}
  .navi:hover{background:rgba(246,241,231,0.07);color:var(--ivory)}
  .navi.on{background:rgba(228,185,104,0.16);color:var(--ivory)}
  .navi .ic{width:20px;text-align:center;font-size:var(--t-md);flex-shrink:0}
  .navi .lbl{flex:1}
  .badge{background:var(--clay);color:#fff;font-size:var(--t-xs);font-weight:700;min-width:20px;height:20px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 var(--s1)}
  .navi.on .badge{background:var(--honey)}
  .side-foot{padding:var(--s4);border-top:1px solid rgba(246,241,231,0.12);display:flex;align-items:center;gap:var(--s3)}
  .side-foot .who{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--blush),var(--honey-soft));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--pine-deep);flex-shrink:0}
  .side-foot .whoinfo{flex:1;font-size:var(--t-sm);line-height:1.3}
  .side-foot .whoinfo b{display:block;color:var(--ivory);font-weight:600}
  .side-foot .whoinfo span{color:rgba(246,241,231,0.55);font-size:var(--t-xs)}
  .signout{background:rgba(246,241,231,0.1);border:none;color:rgba(246,241,231,0.8);width:32px;height:32px;border-radius:9px;font-size:var(--t-md)}
  .signout:hover{background:rgba(246,241,231,0.2);color:#fff}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;max-height:100vh;max-height:100dvh;overflow-y:auto}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,241,231,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:var(--s5) var(--s7);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}
  .topbar h1{font-size:var(--t-3xl);color:var(--pine)}
  .topbar .subtitle{font-size:var(--t-sm);color:var(--muted);margin-top:var(--s1)}
  .hamburger{display:none;background:var(--pine);color:var(--ivory);border:none;width:40px;height:40px;border-radius:10px;font-size:var(--t-lg)}
  .content{padding:var(--s7) var(--s7) var(--s10);max-width:1080px;width:100%}
  .view{display:none;animation:fade .3s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ===== CARDS / PRIMITIVES ===== */
  /* Was repeat(5,1fr) with seven stats, so the last two wrapped alone and
     stretched to a fifth of the width. auto-fit keeps them even at any count. */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3);margin-bottom:var(--s7)}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:var(--s4) var(--s4) var(--s4)}
  .stat .k{font-size:var(--t-xs);letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:var(--s2);line-height:1.3;min-height:2.2em}
  .stat .v{font-size:var(--t-4xl);color:var(--pine);line-height:1}
  .stat .v small{font-size:var(--t-md);color:var(--muted)}
  .stat.alert{border-color:rgba(180,85,47,0.4);background:linear-gradient(180deg,rgba(180,85,47,0.05),#fff)}
  .stat.alert .v{color:var(--clay)}
  @media(max-width:1000px){.stat-row{grid-template-columns:repeat(2,1fr)}}

  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:var(--s1) var(--s6) var(--s3);margin-bottom:var(--s5)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s4) 0 var(--s1);gap:var(--s3)}
  .panel-head h3{font-size:var(--t-lg);color:var(--pine)}
  .panel-head .count{font-size:var(--t-sm);color:var(--muted);font-weight:500}

  .row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) 0;border-top:1px solid var(--ivory-dim)}
  .row:first-of-type{border-top:none}
  .row.flash{animation:flashrow 2s ease-out}
  @keyframes flashrow{0%{background:rgba(200,153,58,0.22)}100%{background:transparent}}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--blush),var(--honey-soft));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--pine-deep);font-size:var(--t-md);flex-shrink:0}
  .avatar.pine{background:var(--pine);color:var(--honey-soft)}
  .rmain{flex:1;min-width:0}
  .rmain .name{font-weight:600;font-size:var(--t-md);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  .rmain .meta{color:var(--muted);font-size:var(--t-sm);margin-top:var(--s1)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
  .tag{font-size:var(--t-xs);background:var(--ivory);border:1px solid var(--line);color:var(--pine);padding:var(--s1) var(--s2);border-radius:100px;font-weight:500}
  .tag.hit{background:rgba(200,153,58,0.14);border-color:transparent;color:var(--honey-deep);font-weight:600}

  .pill{font-size:var(--t-xs);font-weight:700;padding:var(--s1) var(--s3);border-radius:100px;letter-spacing:0.02em;white-space:nowrap}
  .pill.good{background:rgba(30,58,46,0.1);color:var(--pine)}
  .pill.late{background:rgba(157,69,38,0.14);color:var(--clay)}
  .pill.wait{background:rgba(200,153,58,0.18);color:var(--honey-deep)}
  .pill.open{background:rgba(180,85,47,0.12);color:var(--clay)}

  .act{background:var(--pine);color:var(--ivory);border:none;padding:var(--s2) var(--s4);border-radius:100px;font-weight:600;font-size:var(--t-sm);transition:background .16s;white-space:nowrap}
  .act:hover{background:var(--pine-deep)}
  .act.honey{background:var(--honey);color:var(--pine-deep)}
  .act.honey:hover{background:var(--honey-soft)}
  .act.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .act.ghost:hover{border-color:var(--muted);color:var(--ink)}
  .act:disabled{opacity:0.5;cursor:default}

  .empty{text-align:center;color:var(--muted);padding:var(--s7) var(--s5);font-size:var(--t-md)}
  .empty b{display:block;color:var(--pine);font-family:'Fraunces',serif;font-size:var(--t-lg);margin-bottom:var(--s1);font-weight:500}

  /* pipeline */
  .pipe{display:flex;align-items:center;gap:0;margin-top:var(--s3);flex-wrap:wrap}
  .pnode{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);color:var(--muted)}
  .pnode .pd{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--t-xs);flex-shrink:0}
  .pnode.done{color:var(--pine);font-weight:600}
  .pnode.done .pd{background:var(--pine);border-color:var(--pine);color:#fff}
  .pnode.now{color:var(--honey-deep);font-weight:700}
  .pnode.now .pd{border-color:var(--honey);background:rgba(200,153,58,0.18)}
  .pconn{width:22px;height:2px;background:var(--line);margin:0 var(--s1)}
  .pconn.done{background:var(--pine)}

  /* schedule */
  .daygroup{margin-bottom:var(--s5)}
  .dayhead{font-family:'Fraunces',serif;font-size:var(--t-md);color:var(--pine);font-weight:600;padding-bottom:var(--s2);border-bottom:2px solid var(--ivory-dim);margin-bottom:var(--s1);display:flex;justify-content:space-between;align-items:baseline}
  .dayhead span{font-family:'Hanken Grotesk';font-size:var(--t-sm);color:var(--muted);font-weight:500}
  .visit{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--ivory-dim)}
  .visit:first-of-type{border-top:none}
  .vtime{font-family:'Fraunces',serif;font-weight:600;color:var(--pine);font-size:var(--t-md);width:74px;flex-shrink:0}
  .vpair{flex:1;min-width:0}
  .vpair b{font-weight:600}
  .vpair .arrow{color:var(--honey);margin:0 var(--s1)}
  .vpair .vt{color:var(--muted);font-size:var(--t-sm);margin-top:var(--s1)}

  /* ===== DRAWER ===== */
  .scrim{position:fixed;inset:0;background:rgba(21,32,26,0.5);z-index:120;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:440px;max-width:92vw;background:var(--ivory);z-index:130;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,0.2)}
  .drawer.open{transform:none}
  .drawer-head{background:var(--pine);color:var(--ivory);padding:var(--s5) var(--s6);flex-shrink:0}
  .drawer-head .dh-k{font-size:var(--t-xs);letter-spacing:0.12em;text-transform:uppercase;color:var(--honey-soft);font-weight:600;margin-bottom:var(--s2)}
  .drawer-head h3{font-size:var(--t-xl)}
  .drawer-head .dh-sub{color:rgba(246,241,231,0.75);font-size:var(--t-sm);margin-top:var(--s1)}
  .drawer-close{position:absolute;top:18px;right:18px;background:rgba(246,241,231,0.14);border:none;color:var(--ivory);width:32px;height:32px;border-radius:50%;font-size:var(--t-lg)}
  .drawer-close:hover{background:rgba(246,241,231,0.24)}
  .drawer-body{flex:1;overflow-y:auto;padding:var(--s5) var(--s6) var(--s7)}
  .cand{background:#fff;border:1px solid var(--line);border-radius:14px;padding:var(--s4);margin-bottom:var(--s3);transition:border-color .15s}
  .cand:hover{border-color:var(--honey)}
  .cand-top{display:flex;align-items:center;gap:var(--s3)}
  .cand-top .avatar{width:40px;height:40px;font-size:var(--t-md)}
  .cand .cinfo{flex:1;min-width:0}
  .cand .cinfo b{font-weight:600}
  .cand .cinfo .cm{color:var(--muted);font-size:var(--t-sm)}
  .cand .fit{font-size:var(--t-xs);color:var(--honey-deep);font-weight:600;margin:var(--s2) 0}
  .cand .act{width:100%;text-align:center}

  /* ===== TOAST ===== */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--pine-deep);color:var(--ivory);padding:var(--s3) var(--s5);border-radius:100px;font-size:var(--t-md);font-weight:500;z-index:300;opacity:0;transition:all .3s;display:flex;align-items:center;gap:var(--s2);box-shadow:0 14px 40px rgba(0,0,0,0.3);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .dot{background:var(--honey-soft)}

  .demo-note{font-size:var(--t-xs);color:var(--muted);text-align:center;padding:var(--s2) var(--s5) var(--s6)}

  @media(max-width:820px){
    .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .28s}
    .side.show{transform:none}
    .hamburger{display:block}
    .topbar{padding:var(--s4) var(--s4)}
    .content{padding:var(--s5) var(--s4) var(--s10)}
    .topbar h1{font-size:var(--t-2xl)}
  }
  .schedrow{margin-bottom:var(--s3)}
  .schedrow label{display:block;font-weight:600;font-size:var(--t-sm);margin-bottom:var(--s1);color:var(--pine)}
  .schedrow input,.schedrow select{width:100%;padding:var(--s3) var(--s3);border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:var(--t-md);background:#fff;color:var(--ink)}
  .schedrow input:focus,.schedrow select:focus{outline:2px solid var(--honey-soft);border-color:var(--honey)}
  .timechip{background:var(--ivory);border:1px solid var(--line);color:var(--pine);border-radius:100px;padding:var(--s2) var(--s3);font-family:inherit;font-size:var(--t-sm);font-weight:600;cursor:pointer;min-height:36px}
  .timechip:hover{border-color:var(--honey);background:#fff}
  .fitlist{margin:var(--s2) 0}
  .fitrow{font-size:var(--t-sm);line-height:1.5;display:flex;gap:var(--s2)}
  .fitrow.ok{color:var(--pine)}
  .fitrow.no{color:var(--clay);font-weight:600}
  .cand.imperfect{border-color:rgba(157,69,38,.35)}
  .minibtn{background:var(--ivory);border:1px solid var(--line);color:var(--pine);border-radius:100px;padding:var(--s2) var(--s3);font-family:inherit;font-size:var(--t-sm);font-weight:600;cursor:pointer;white-space:nowrap}
  .minibtn:hover{border-color:var(--honey)}
  .bg-missing{margin-top:var(--s2);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
    color:var(--clay);font-weight:600}
  .vetlog{margin-top:var(--s3);border-left:2px solid var(--line);padding-left:var(--s3)}
  .vetrow{font-size:var(--t-sm);color:var(--pine);padding:var(--s1) 0}
  .vetwhen{color:var(--slate);font-weight:400;margin-left:var(--s2)}
  .minibtn.done{background:var(--pine);color:var(--ivory);border-color:var(--pine)}
  .sched-add{background:var(--honey);color:var(--pine-deep);border:none;border-radius:100px;padding:var(--s3) var(--s5);font-family:inherit;font-weight:700;font-size:var(--t-sm);cursor:pointer;margin-bottom:var(--s4)}
  .sched-add:hover{background:var(--honey-soft)}

  /* ---- ST-1: in-app sheet, replacing native alert/confirm/prompt --------
     Native dialogs render as "moms.hiremarmee.com says", cannot be styled,
     and look like the browser warnings people are told to distrust.        */
  .sheet-scrim{position:fixed;inset:0;background:rgba(21,32,26,.5);z-index:400;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:100%;max-width:460px;background:var(--ivory);border-radius:22px 22px 0 0;padding:var(--s6) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom,0px));z-index:401;transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .sheet.on{transform:translate(-50%,0)}
  .sheet h3{font-family:'Fraunces',Georgia,serif;font-size:var(--t-xl);color:var(--pine);margin-bottom:var(--s2)}
  .sheet .sheet-sub{color:var(--muted);font-size:var(--t-sm);margin-bottom:var(--s4)}
  .sheet label{display:block;font-weight:600;font-size:var(--t-sm);margin-bottom:var(--s2);color:var(--pine)}
  .sheet input,.sheet textarea{width:100%;padding:var(--s3) var(--s4);border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:var(--t-md);background:#fff;color:var(--ink);margin-bottom:var(--s4)}
  .sheet input:focus,.sheet textarea:focus{outline:2px solid var(--honey-soft);border-color:var(--honey)}
  .sheet-btns{display:flex;gap:var(--s3)}
  .sheet-btns button{flex:1;border:none;border-radius:100px;padding:var(--s3);font-family:inherit;font-weight:700;font-size:var(--t-md);min-height:48px;cursor:pointer}
  .sheet-cancel{background:#fff;border:1.5px solid var(--line);color:var(--muted)}
  .sheet-ok{background:var(--pine);color:var(--ivory)}
  .sheet-ok.danger{background:var(--clay);color:#fff}

  /* ---- Password show/hide -------------------------------------------- */
  .pw-wrap{position:relative;display:block}
  .pw-wrap input{padding-right:78px !important;margin-bottom:0 !important}
  .pw-toggle{position:absolute;right:var(--s1);top:50%;transform:translateY(-50%);background:none;border:none;color:var(--honey-deep);font-family:inherit;font-weight:700;font-size:var(--t-sm);cursor:pointer;min-height:44px;padding:0 var(--s3);border-radius:100px}
  .pw-toggle:hover{background:rgba(200,153,58,.12)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ================= LOGIN GATE ================= -->
<div class="gate" id="gate">
  <div class="gate-card">

function rateFor(fam){
  const mk = fam && marketById(fam.market_id);

  return (cents && isFinite(cents)) ? cents/100 : RATE;

const fmtPhone = p => { const d=(p||'').replace(/\D/g,''); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p||''); };

function fmtDay(d){
  if(!d) return 'Scheduled';
  // `visit_date` is a plain date; `completed_at` and `bg_checked_at` are
  // timestamptz. Appending T12:00:00 to a value that already carries a time
  // gives "Invalid Date" — which is what the vetting log rendered.
  // Midday anchoring stays for bare dates so a timezone shift can't walk
  // them back a day.
  const dt = /[T ]/.test(String(d)) ? new Date(d) : new Date(d + 'T12:00:00');
  if(isNaN(dt)) return '';
  return dt.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}

// toISOString() is UTC. In Maine that rolls over at 8pm EDT, so from 8pm the
// console called tomorrow "today": today's visits dropped into "Needs
// attention — these dates have passed" with an Overdue pill, and the date
// pickers refused to let you book anything for today.
function todayLocal(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function arr(a){ return Array.isArray(a) ? a : (a ? String(a).replace(/[{}"]/g,'').split(',').filter(Boolean) : []); }

let toastTimer;

/* ================= AUTH ================= */

// ER-1: never show a raw backend string to a person.
const AUTH_MESSAGES = {
  'Invalid login credentials': 'That email and password do not match.',
  'Email not confirmed': 'This login has not been confirmed yet.',
  'Email logins are disabled': 'Sign-in is temporarily unavailable. Try again shortly.',
};
function loginErr(msg){ const e=$('#loginErr'); e.textContent=msg; e.style.display=msg?'block':'none'; }

async function login(){
  if(!db){ loginErr('Could not reach the database library. Check your internet and refresh.'); return; }
  const email=$('#email').value.trim(), pass=$('#pass').value;
  if(!email||!pass){ loginErr('Enter your email and password.'); return; }
  const btn=$('#loginBtn'); btn.textContent='Signing in…'; btn.disabled=true; loginErr('');
  try{
    const { data, error } = await withTimeout(
      db.auth.signInWithPassword({ email, password: pass }), 15000);
    if(error){ loginErr(AUTH_MESSAGES[error.message] || 'That didn\u2019t work. Check your details.'); }
    else { await withTimeout(enterApp(data && data.user), 15000); }
  }catch(e){
    loginErr(e && e.message === 'timeout'
      ? 'That took too long. Check your connection and try again.'
      : 'Something went wrong signing in. Try again.');
  }finally{
    btn.textContent='Sign in'; btn.disabled=false;
  }
}

// Never let the sign-in button hang forever on a stalled request.
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}

async function signout(){ if(db) await db.auth.signOut(); $('#shell').classList.remove('open'); $('#gate').classList.remove('hidden'); $('#pass').value=''; }

async function enterApp(signedInUser){
  // Prefer the user object the sign-in already returned. Calling getUser()
  // here can deadlock against the auth lock held by signInWithPassword().
  let user = signedInUser;
  if(!user){
    const { data:{ session } } = await db.auth.getSession();
    user = session && session.user;
  }
  const email = user?.email || 'Operator';
  $('#whoName').textContent = email.split('@')[0];
  $('#whoAva').textContent = (email[0]||'·').toUpperCase();
  // The gate used to be hidden here, before loadAll(). If loading then failed
  // or timed out, loginErr() wrote into #loginErr — which lives inside the
  // gate that had just been hidden. On a slow connection you got a blank
  // console and no explanation anywhere. Load first, reveal second.
  await loadAll(true);
  $('#gate').classList.add('hidden');
  $('#shell').classList.add('open');
  renderAll();
}

/* ================= DATA ================= */
// supabase-js RESOLVES with { data, error }; it never rejects on an RLS
// denial, a constraint violation or a 400. So every `try{ await db...update()
// }catch{}` in this file was dead code: the write failed, the catch never
// fired, and the operator got a success toast. Worse, completeVisit() then
// ran on and charged a card for a visit it had failed to mark done.
// Wrap a write in must() and a failure behaves like one.
async function must(builder, what){
  const { data, error } = await builder;
  if(error) throw new Error((what || 'That change') + ' failed: ' + error.message);
  return data;
}

async function loadAll(strict){
  try{
    const [m,f,r,v,mt,vg,mk,wl,ms,zc,nb,tk,rv] = await Promise.all([
      db.from('moms').select('*').order('created_at',{ascending:true}),

      db.from('markets').select('*'),
      db.from('waitlist').select('*').order('created_at',{ascending:false}),
      db.from('messages').select('*').order('created_at',{ascending:true}),

      db.from('neighborhoods').select('*').order('name'),
      db.from('visit_tasks').select('*').order('created_at',{ascending:true}),
      db.from('reviews').select('*').order('created_at',{ascending:false}),
    ]);
    state.moms = m.data||[]; state.families=f.data||[]; state.requests=r.data||[];
    state.visits=v.data||[]; state.matches=mt.data||[]; state.vetting=vg.data||[]; state.markets=mk.data||[]; state.waitlist=wl.data||[]; state.messages=ms.data||[]; state.zips=zc.data||[]; state.hoods=nb.data||[]; state.tasks=tk.data||[]; state.reviews=rv.data||[];
    if(m.error||f.error||r.error||v.error||mt.error||vg.error||mk.error||wl.error||ms.error||zc.error||nb.error||tk.error||rv.error){ toast('Loaded, but some data was blocked — did the access rules run?'); }
  }catch(e){
    // Sign-in needs to know, so it can say so while the gate is still on
    // screen. Every other caller is a refresh after a write and has its own
    // error handling, so for those a toast is still the right response.
    if(strict) throw new Error('Could not load your data. Check your connection and try again.');
    toast('Could not load data. Check your connection.');
  }
}

/* ================= RENDER ================= */
function renderAll(){ buildNav(); renderOverview(); renderRequests(); renderMoms(); renderFamilies(); renderSchedule(); renderWaitlist(); renderMessages(); renderCoverage(); }

// "Greater Portland is live" is one fact covering twenty-three towns. Six
// Marms all on the peninsula and a Mom in Gorham gets told we are here, then
// waits three weeks. This is the number that decides whether that happens:
// supply and demand side by side, town by town, gaps first.
const CV = { GAP:'gap', THIN:'thin', OK:'ok', QUIET:'quiet' };

function coverageRows(){
  const norm = x => String(x||'').trim().toLowerCase();
  const hoods = (state.hoods||[]).map(h=>h.name);

  // Any place someone actually wrote counts, even if it is not on our list —
  // otherwise a town we forgot to seed looks like it has nobody in it.
  const extra = [...new Set(
    [...state.moms, ...state.families].map(x=>x.neighborhood).filter(Boolean)
  )].filter(n => !hoods.some(h => norm(h) === norm(n)));

  return [...hoods, ...extra].map(name => {
    const marms = state.moms.filter(m => norm(m.neighborhood) === norm(name));
    const active = marms.filter(m => m.status === 'active').length;
    const vetting = marms.length - active;
    const moms = state.families.filter(f => norm(f.neighborhood) === norm(name)).length;

    let state_ = CV.QUIET;
    if(moms > 0 && active === 0)      state_ = CV.GAP;
    else if(active === 1)             state_ = CV.THIN;
    else if(active >= 2)              state_ = CV.OK;

    return { name, active, vetting, moms, state: state_,
             onList: hoods.some(h => norm(h) === norm(name)) };
  }).sort((a,b) => {
    const rank = { [CV.GAP]:0, [CV.THIN]:1, [CV.OK]:2, [CV.QUIET]:3 };
    return rank[a.state] - rank[b.state]
        || (b.moms - a.moms)
        || a.name.localeCompare(b.name);
  });
}

function renderCoverage(){
  const rows = coverageRows();
  const gaps  = rows.filter(r=>r.state===CV.GAP);
  const thin  = rows.filter(r=>r.state===CV.THIN);
  const ok    = rows.filter(r=>r.state===CV.OK);
  const quiet = rows.filter(r=>r.state===CV.QUIET);
  const mk    = (state.markets||[])[0];
  const need  = mk ? Number(mk.launch_min_marms||0) : 0;
  const activeTotal = activeMoms().length;

  let html = `<div class="stat-row">
    <div class="stat ${gaps.length?'alert':''}"><div class="k">Towns with a gap</div><div class="v mono-num">${gaps.length}</div></div>
    <div class="stat"><div class="k">Covered</div><div class="v mono-num">${ok.length}</div></div>
    <div class="stat"><div class="k">One Marm only</div><div class="v mono-num">${thin.length}</div></div>
    <div class="stat"><div class="k">Nobody yet</div><div class="v mono-num">${quiet.length}</div></div>
  </div>`;

  if(mk && need){
    const short = Math.max(0, need - activeTotal);
    html += `<div class="panel"><div class="panel-head"><h3>${esc(mk.name)}</h3>
      <span class="count">${esc(mk.status)}</span></div>
      <div class="row"><div class="rmain">
        <div class="name">${activeTotal} active Marm${activeTotal===1?'':'s'} · you set the bar at ${need}</div>
        <div class="meta">${short
          ? `<span style="color:var(--clay);font-weight:600">${short} short of the number you decided a market needs before it should be live.</span>`
          : 'At or above the number you decided a market needs before it should be live.'}</div>
      </div></div></div>`;
  }

  const label = {
    [CV.GAP]:   ['Gap', 'open'],
    [CV.THIN]:  ['One Marm', 'wait'],
    [CV.OK]:    ['Covered', 'good'],
    [CV.QUIET]: ['Nobody yet', 'wait']
  };

  html += `<div class="panel"><div class="panel-head"><h3>Town by town</h3>
    <span class="count">${rows.length} town${rows.length===1?'':'s'}</span></div>`;

  if(!rows.length){
    html += `<div class="empty"><b>No towns yet</b>Seed the neighbourhood list for this market and people will appear here.</div>`;
  } else {
    rows.forEach(r=>{
      const [txt, pill] = label[r.state];
      const bar = r.state===CV.GAP ? 'var(--clay)'
                : r.state===CV.THIN ? 'var(--honey)'
                : r.state===CV.OK ? 'var(--pine)' : 'var(--line)';
      html += `<div class="row" style="border-left:3px solid ${bar};padding-left:var(--s4)">
        <div class="rmain">
          <div class="name">${esc(r.name)} <span class="pill ${pill}">${txt}</span>
            ${r.onList?'':'<span class="pill wait">not on the list</span>'}</div>
          <div class="meta">${r.active} Marm${r.active===1?'':'s'}${r.vetting?(' · '+r.vetting+' in vetting'):''} · ${r.moms} Mom${r.moms===1?'':'s'}</div>
          ${r.state===CV.GAP?`<div class="meta" style="color:var(--clay);font-weight:600;margin-top:var(--s1)">${r.moms} household${r.moms===1?'':'s'} here and nobody to send.</div>`:''}
        </div></div>`;
    });
  }
  html += `</div>`;

  // ---- What each city charges and pays ---------------------------------
  // These two numbers used to live in three places that had to agree: a
  // constant in the console, a constant in the Marm's app, and a fallback in
  // the payout function. Now they live here, and everything else reads them.
  const markets = state.markets || [];
  html += `<div class="panel"><div class="panel-head"><h3>Rates</h3>
    <span class="count">${markets.length} market${markets.length===1?'':'s'}</span></div>`;

  if(!markets.length){
    html += `<div class="empty"><b>No markets yet</b>Add one before you can set a rate.</div>`;
  } else {
    markets.forEach(m=>{
      const client = Number(m.hourly_rate_cents || 0) / 100;
      const marm   = Number(m.marm_rate_cents   || 0) / 100;
      const margin = client - marm;
      const take   = client > 0 ? Math.round((margin / client) * 100) : 0;
      // Below about 20% there is not enough left to cover Stripe, a
      // background check and an hour of your time. Worth seeing at a glance.
      const thin   = take < 20;
      html += `<div class="row">
        <div class="rmain">
          <div class="name">${esc(m.name)} <span class="pill ${m.status==='live'?'good':'wait'}">${esc(m.status||'')}</span></div>
          <div class="meta">Mom pays <b class="mono-num">$${client.toFixed(2).replace(/\.00$/,'')}</b>/hr
            · Marm keeps <b class="mono-num">$${marm.toFixed(2).replace(/\.00$/,'')}</b>/hr
            · you keep <b class="mono-num">$${margin.toFixed(2).replace(/\.00$/,'')}</b>/hr</div>
          <div class="meta"${thin?' style="color:var(--clay);font-weight:600"':''}>${take}% of every visit${thin?' — thin once Stripe and vetting come out.':''}</div>
        </div>
        <button class="act ghost" onclick="editRates('${m.id}')">Change</button>
      </div>`;
    });
    html += `<div class="row"><div class="rmain"><div class="meta">
      Changing a rate only affects visits booked from now on. Every visit
      already on the books keeps the price it was booked at.
    </div></div></div>`;
  }
  html += `</div>`;

  $('#view-coverage').innerHTML = html;
}

// Editing the two numbers a market runs on. Guarded rather than trusted:
// a fat-fingered zero here would either bankrupt the round or charge a
// household $350 an hour, and neither shows up until money moves.
async function editRates(marketId){
  const m = (state.markets||[]).find(x => x.id === marketId);
  if(!m){ toast('Could not find that market.'); return; }

  const r = await openSheet({
    title: 'Rates for ' + m.name,
    sub: 'What the household pays, and what the Marm takes home. Her rate is a promise in its own right, not a share of the first number.',
    bodyHTML:
        '<label for="shClient">The Mom pays, per hour</label>'
      + '<input id="shClient" type="number" step="0.25" min="1" max="200" value="'
        + (Number(m.hourly_rate_cents||0)/100) + '">'
      + '<label for="shMarm">The Marm keeps, per hour</label>'
      + '<input id="shMarm" type="number" step="0.25" min="1" max="200" value="'
        + (Number(m.marm_rate_cents||0)/100) + '">',
    okLabel: 'Save rates',
    validate: v => {
      const c = Number(v.shClient), k = Number(v.shMarm);
      if(!isFinite(c) || c <= 0) return 'The household rate has to be a number above zero.';
      if(!isFinite(k) || k <= 0) return 'The Marm rate has to be a number above zero.';
      if(k > c) return 'She cannot take home more than the household pays.';
      if(k === c) return 'That leaves nothing to run Marmee on.';
      if((c - k) / c < 0.10) return 'That leaves under 10% — Stripe alone takes about 3%. Are you sure?';
      return null;
    }
  });
  if(!r.ok) return;

  try{
    await must(db.from('markets').update({
      hourly_rate_cents: Math.round(Number(r.values.shClient) * 100),
      marm_rate_cents:   Math.round(Number(r.values.shMarm)   * 100)
    }).eq('id', marketId), 'Saving the rates');

    // Re-read rather than patching the local copy.
    const { data } = await db.from('markets').select('*');
    state.markets = data || state.markets;
    renderCoverage();
    toast('Rates saved for ' + m.name + '.');
  }catch(e){
    toast(e.message || 'Could not save those rates.');
  }
}

// You can read every conversation, and both apps tell people so. That
// promise is only honest if there is somewhere to actually read them —
// otherwise the disclosure is a warning about a power that does not exist,
// and the oversight it implies never happens.
function renderMessages(){
  const all = state.messages || [];
  const threads = {};
  all.forEach(m=>{
    const k = m.family_id + '|' + m.mom_id;
    (threads[k] = threads[k] || []).push(m);
  });
  const list = Object.entries(threads)
    .map(([k, msgs]) => ({ k, msgs, last: msgs[msgs.length-1] }))
    .sort((a,b) => String(b.last.created_at).localeCompare(String(a.last.created_at)));

  let html = `<div class="stat-row">
    <div class="stat"><div class="k">Conversations</div><div class="v mono-num">${list.length}</div></div>
    <div class="stat"><div class="k">Messages</div><div class="v mono-num">${all.length}</div></div>
  </div>`;

  html += `<div class="panel"><div class="panel-head"><h3>Conversations</h3>
    <span class="count">${list.length}</span></div>`;

  if(!list.length){
    html += `<div class="empty"><b>No messages yet</b>When a Marm and a Mom start talking, their conversation appears here.</div>`;
  } else {
    list.forEach(({k, msgs, last})=>{
      const [fid, mid] = k.split('|');
      const mom = state.moms.find(x=>x.id===mid);
      html += `<div class="row" style="align-items:flex-start">
        <div class="avatar pine">${initials(famNameRaw(fid))}</div>
        <div class="rmain">
          <div class="name">${famName(fid)} &harr; ${mom?momName(mom):'—'}
            <span class="pill wait">${msgs.length} message${msgs.length===1?'':'s'}</span></div>
          <div class="meta">Last ${fmtDay(last.created_at)}</div>
          <div class="vetlog">${msgs.slice(-6).map(m=>{
            const who = m.sender_role==='mom' ? (mom?mom.first_name:'Marm')
                      : m.sender_role==='family' ? famNameRaw(fid) : 'Marmee';
            return `<div class="vetrow"><b>${esc(who)}</b> — ${esc(m.body)}
              <span class="vetwhen">${fmtDay(m.created_at)}</span></div>`;
          }).join('')}
          ${msgs.length>6?`<div class="vetrow"><span class="vetwhen">and ${msgs.length-6} earlier</span></div>`:''}
          </div>
        </div></div>`;
    });
  }
  html += `</div>`;
  $('#view-messages').innerHTML = html;
}

// Where people are asking for Marmee that we have not opened. This is the
// only honest answer to "which city next" — grouped by ZIP so a cluster of
// eight in one postcode reads differently from eight scattered across a state.
function renderWaitlist(){
  const rows = state.waitlist || [];
  const byZip = {};
  rows.forEach(w=>{
    const z = w.zip || 'No ZIP given';
    (byZip[z] = byZip[z] || []).push(w);
  });
  const groups = Object.entries(byZip).sort((a,b)=> b[1].length - a[1].length);

  const moms  = rows.filter(w=>w.side==='mom').length;
  const marms = rows.filter(w=>w.side==='marm').length;

  let html = `<div class="stat-row">
    <div class="stat"><div class="k">Waiting</div><div class="v mono-num">${rows.length}</div></div>
    <div class="stat"><div class="k">Moms wanting help</div><div class="v mono-num">${moms}</div></div>
    <div class="stat"><div class="k">Marms wanting work</div><div class="v mono-num">${marms}</div></div>
    <div class="stat"><div class="k">Postcodes</div><div class="v mono-num">${groups.filter(g=>g[0]!=='No ZIP given').length}</div></div>
  </div>`;

  html += `<div class="panel"><div class="panel-head"><h3>By postcode</h3>
    <span class="count">${groups.length} area${groups.length===1?'':'s'}</span></div>`;

  if(!rows.length){
    html += `<div class="empty"><b>Nobody waiting yet</b>When someone enters a ZIP we do not cover, they land here.</div>`;
  } else {
    groups.forEach(([zip, list])=>{
      const m2 = list.filter(w=>w.side==='mom').length;
      const k2 = list.filter(w=>w.side==='marm').length;
      html += `<div class="row" style="align-items:flex-start">
        <div class="avatar pine">${esc(zip.slice(0,3))}</div>
        <div class="rmain">
          <div class="name">${esc(zip)} <span class="pill ${list.length>=5?'open':'wait'}">${list.length} waiting</span></div>
          <div class="meta">${m2} Mom${m2===1?'':'s'} · ${k2} Marm${k2===1?'':'s'}</div>
          <div class="vetlog">${list.slice(0,8).map(w=>
            `<div class="vetrow"><b>${w.side==='mom'?'Mom':'Marm'}</b> — ${esc(w.email)}
             <span class="vetwhen">${fmtDay(w.created_at)}</span></div>`).join('')}
            ${list.length>8?`<div class="vetrow"><span class="vetwhen">and ${list.length-8} more</span></div>`:''}
          </div>
        </div></div>`;
    });
  }
  html += `</div>`;
  $('#view-waitlist').innerHTML = html;
}

function renderOverview(){
  const upcoming = state.visits.filter(v=>v.status==='upcoming'||v.status==='confirmed');
  const est = Math.round(upcoming.reduce((s,v)=> s + (Number(v.hours)||0)*visitRate(v)*FEE, 0));

  // Money that actually arrived, and money owed but not collected. The
  // estimate above is a forecast; these two are facts.
  const collected = state.visits
    .filter(v=>v.payment_status==='paid')
    .reduce((s,v)=> s + (Number(v.amount_cents)||0)/100, 0);
  const outstanding = state.visits
    .filter(v=>v.status==='completed' && !['paid','refunded'].includes(v.payment_status))
    .reduce((s,v)=> s + (Number(v.hours)||0)*visitRate(v), 0);
  const noCard = state.families.filter(f=>!f.payment_method_id).length;
  const stats = [
    {k:'Open requests', v:openReqs().length, alert:openReqs().length>0},
    {k:'Active Marms', v:activeMoms().length},
    {k:'In vetting', v:pendingMoms().length, alert:pendingMoms().length>0},
    {k:'Upcoming visits', v:upcoming.length},
    {k:'Your cut, collected', v:`<small>$</small>${Math.round(collected*FEE)}`},
    {k:'Uncollected', v:`<small>$</small>${Math.round(outstanding)}`, alert: outstanding > 0},
    // Was computed and thrown away. A household with no card cannot be
    // charged, so this is the number that quietly caps your revenue.
    {k:'No card on file', v:noCard, alert: noCard > 0},
    // Money already collected from Moms that has not reached the Marms. It
    // is not yours, and showing it beside "collected" keeps that honest.
    {k:'Owed to Marms', v:`<small>$</small>${Math.round(
        Object.values(owedByMarm()).reduce((t,x)=>t+x.cents,0)/100)}`,
      alert: Object.keys(owedByMarm()).length > 0},
  ];
  let attn='';
  const oreq=openReqs(), pmoms=pendingMoms();
  const nocardFams = state.families.filter(f=>!f.payment_method_id);
  const poor = lowRatings();
  if(!oreq.length && !pmoms.length && !nocardFams.length && !poor.length){
    attn = `<div class="empty"><b>All caught up</b>No open requests, nobody waiting in vetting, every household has a card, and no poor ratings.</div>`;
  } else {
    oreq.forEach(r=>{
      attn += `<div class="row">
        <div class="avatar pine">${initials(famNameRaw(r.family_id))}</div>
        <div class="rmain"><div class="name">${famName(r.family_id)} <span class="pill open">Needs a Marm</span></div>
          <div class="meta">${esc(r.frequency||'')} · ${esc(famById(r.family_id)?.neighborhood||'')} · ${esc(arr(r.areas).join(', '))}</div></div>
        <button class="act honey" onclick="openMatch('${r.id}')">Assign</button></div>`;
    });
    poor.forEach(r=>{
      const v = state.visits.find(x=>x.id===r.visit_id);
      const mom = v && state.moms.find(m=>m.id===v.mom_id);
      const who = r.reviewer_role === 'mom' ? 'A Marm' : 'A Mom';
      attn += `<div class="row">
        <div class="avatar pine">${'★'.repeat(Number(r.rating)||0)||'!'}</div>
        <div class="rmain"><div class="name">${who} rated a visit ${Number(r.rating)||0} of 5
          <span class="pill open">Needs a call</span></div>
          <div class="meta">${v?(esc(famNameRaw(v.family_id))+' with '+(mom?momName(mom):'—')+' · '+fmtDay(v.visit_date)):'Visit not found'}${r.comment?(' — '+esc(r.comment)):''}</div></div>
        ${v?`<button class="act" onclick="go('schedule')">Open</button>`:''}</div>`;
    });
    state.families.filter(f=>!f.payment_method_id).forEach(f=>{
      attn += `<div class="row">
        <div class="avatar pine">${initials(famNameRaw(f.id))}</div>
        <div class="rmain"><div class="name">${esc(f.name||'')} <span class="pill wait">No card</span></div>
          <div class="meta">Visits for this household cannot be charged until she adds one.</div></div>
        <button class="act" onclick="go('families','${f.id}')">Open</button></div>`;
    });
    pmoms.forEach(m=>{
      // STAGES[vetting_stage] is the step just completed. The Marms tab
      // already shows the next one, and the two disagreeing on the same
      // person is how you lose track of where someone actually is.
      const stg = STAGES[(m.vetting_stage||0) + 1] || 'Ready to activate';
      attn += `<div class="row">
        <div class="avatar">${initials(momNameRaw(m))}</div>
        <div class="rmain"><div class="name">${momName(m)} <span class="pill wait">In vetting</span></div>
          <div class="meta">Next step: ${stg} · ${esc(m.neighborhood||'')}</div></div>
        <button class="act" onclick="go('moms','${m.id}')">Review</button></div>`;
    });
  }
  $('#view-overview').innerHTML = `
    <div class="stat-row">
      ${stats.map(s=>`<div class="stat ${s.alert?'alert':''}"><div class="k">${s.k}</div><div class="v mono-num">${s.v}</div></div>`).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Needs your attention</h3><span class="count">${oreq.length+pmoms.length+nocardFams.length+poor.length} item${(oreq.length+pmoms.length+nocardFams.length+poor.length)===1?'':'s'}</span></div>
      ${attn}
    </div>`;
}

function renderRequests(){
  const list = state.requests;
  let html = `<div class="panel"><div class="panel-head"><h3>Mom requests</h3>
    <span class="count">${openReqs().length} open · ${list.length-openReqs().length} matched</span></div>`;
  if(!list.length){ html += `<div class="empty"><b>No requests yet</b>New Mom requests will land here.</div>`; }
  list.forEach(r=>{
    const matched = r.status!=='open';
    const mt = matchFor(r.id);
    const mom = mt ? state.moms.find(m=>m.id===mt.mom_id) : null;
    html += `<div class="row">
      <div class="avatar pine">${initials(famNameRaw(r.family_id))}</div>
      <div class="rmain">
        <div class="name">${famName(r.family_id)}
          ${matched?`<span class="pill good">Matched${mom?' · '+momName(mom):''}</span>`:`<span class="pill open">Needs a Marm</span>`}</div>
        <div class="meta">${esc(r.frequency||'')} · ${esc(famById(r.family_id)?.neighborhood||'')} · ${esc(r.preferred_window||'')}</div>
        <div class="chips">${arr(r.areas).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      </div>
      ${matched
        ? `<button class="act ghost" disabled>Scheduled</button>`
        : `<button class="act honey" onclick="openMatch('${r.id}')">Assign a Marm</button>`}
    </div>`;
  });
  html += `</div>`;
  $('#view-requests').innerHTML = html;
}

// The record of what was actually done, in the operator's own words.
function vetHistory(momId){
  const rows = (state.vetting||[]).filter(x=>x.mom_id===momId);
  if(!rows.length) return '<div class="meta" style="margin-top:var(--s2);color:var(--clay)">No steps recorded yet</div>';
  return '<div class="vetlog">' + rows.map(x=>
    `<div class="vetrow"><b>${x.stage}</b>${x.note?(' — '+esc(x.note)):''}
     <span class="vetwhen">${fmtDay(x.completed_at)}</span></div>`).join('') + '</div>';
}

// Shown wherever a Marm appears, vetting or active. An active Marm without a
// recorded check is the thing you most need to see, so it is loudest there.
function bgLine(m){
  if(m.bg_check_status === 'clear'){
    return `<div class="meta" style="margin-top:var(--s1)">✓ Background check clear${m.bg_reference?(' · '+esc(m.bg_reference)):''}${m.bg_checked_at?(' · '+fmtDay(m.bg_checked_at)):''}</div>`;
  }
  return `<div class="meta bg-missing"><span>⚠ No background check on file</span>
    <button class="minibtn" onclick="markBgClear('${m.id}')">Record it</button></div>`;
}

function renderMoms(){
  const act=activeMoms(), pend=pendingMoms();
  // In vetting first: it is the queue that needs action. The active roster is
  // reference data and belongs underneath it.
  let html = `<div class="panel"><div class="panel-head"><h3>In vetting</h3><span class="count">${pend.length} applicant${pend.length===1?'':'s'}</span></div>`;
  if(!pend.length){ html += `<div class="empty"><b>Nobody waiting</b>New applicants from the Marm sign-up show up here.</div>`; }
  pend.forEach(m=>{
    const stage = m.vetting_stage||0;
    const atEnd = stage >= STAGES.length-1;
    let pipe='<div class="pipe">';
    STAGES.forEach((st,i)=>{
      const cls = i<stage?'done':(i===stage?'now':'');
      pipe += `<div class="pnode ${cls}"><span class="pd">${i<stage?'✓':''}</span>${st}</div>`;
      if(i<STAGES.length-1) pipe += `<div class="pconn ${i<stage?'done':''}"></div>`;
    });
    pipe+='</div>';
    html += `<div class="row" id="rec-${m.id}" style="align-items:flex-start">
      <div class="avatar">${initials(momNameRaw(m))}</div>
      <div class="rmain">
        <div class="name">${momName(m)} <span class="pill wait">${m.status==='new'?'New applicant':'Vetting'}</span></div>
        <div class="meta">${esc(m.neighborhood||'')}${m.times_available?(' · '+arr(m.times_available).join(', ')):''}</div>
        ${m.phone?`<div class="meta" style="margin-top:var(--s1)">☎ <a href="tel:${encodeURIComponent(String(m.phone).replace(/[^0-9+]/g,''))}" style="color:var(--honey-deep);font-weight:700;text-decoration:none">${esc(fmtPhone(m.phone))}</a></div>`:'<div class="meta" style="margin-top:var(--s1);color:var(--clay)">No phone on file</div>'}
        ${bgLine(m)}
        ${pipe}
        ${vetHistory(m.id)}
      </div>
      <button class="act" onclick="advance('${m.id}')">${atEnd?'Activate':'Mark '+STAGES[stage+1]+' done'}</button>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="panel"><div class="panel-head"><h3>Active roster</h3><span class="count">${act.length} Marm${act.length===1?'':'s'}</span></div>`;
  if(!act.length){ html += `<div class="empty"><b>No active Marms yet</b>Approved Marms will appear here.</div>`; }
  act.forEach(m=>{
    const fc = momFamilyCount(m.id);
    html += `<div class="row" id="rec-${m.id}">
      <div class="avatar">${initials(momNameRaw(m))}</div>
      <div class="rmain">
        <div class="name">${momName(m)} ${m.bg_check_status==='clear'
          ? '<span class="pill good">Active</span>'
          : '<span class="pill wait">Active — unverified</span>'}</div>
        <div class="meta">${m.rating?('★ '+Number(m.rating).toFixed(1)+' · '):''}${esc(m.neighborhood||'')} · ${fc} Mom${fc===1?'':'s'}${m.times_available?(' · '+arr(m.times_available).join(', ')):''}</div>
        ${bgLine(m)}
        <div class="meta" style="margin-top:var(--s1)">${payoutLine(m)}
          ${(owedByMarm()[m.id]||{}).cents ? ` · <b>$${((owedByMarm()[m.id].cents)/100).toFixed(2)} owed</b>` : ''}
          <button class="minibtn" style="margin-left:var(--s2)" onclick="checkPayoutStatus('${m.id}')">Check</button></div>
        <div class="chips">${arr(m.areas).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
      </div></div>`;
  });
  html += `</div>`;
  $('#view-moms').innerHTML = html;
}

function renderFamilies(){
  let html = `<div class="panel"><div class="panel-head"><h3>Your Moms</h3><span class="count">${state.families.length} households</span></div>`;
  if(!state.families.length){ html += `<div class="empty"><b>No Moms yet</b>Add them here or they arrive from the Mom app.</div>`; }
  state.families.forEach(f=>{
    // visits comes back unordered and included cancelled ones, so this
    // showed whichever row happened to be first — sometimes a Marm who had
    // been replaced, sometimes one whose only visit was cancelled.
    const v = state.visits
      .filter(x=>x.family_id===f.id && x.status !== 'cancelled')
      .sort((a,b)=> String(b.visit_date||'').localeCompare(String(a.visit_date||'')));
    const mom = v.length ? state.moms.find(m=>m.id===v[0].mom_id) : null;
    const planTag = mom ? `<span class="tag hit">With ${momName(mom)}</span>` : `<span class="tag">No Marm yet</span>`;
    html += `<div class="row">
      <div class="avatar pine">${initials(f.name)}</div>
      <div class="rmain">
        <div class="name">${esc(f.name)} <span class="pill ${f.status==='active'?'good':'wait'}">${f.status==='active'?'Active':'Lead'}</span></div>
        <div class="meta">${esc(f.neighborhood||'')}${f.joined_at?(' · Joined '+fmtDay(f.joined_at)):''}</div>
        ${homeLine(f)?`<div class="meta" style="margin-top:var(--s1)">${homeLine(f)}</div>`:''}
        <div class="meta" style="margin-top:var(--s1)">${f.address_line
          ? esc(f.address_line)
          : '<span style="color:var(--clay);font-weight:600">No address — her Marm cannot find the house</span>'}</div>
        <div class="meta" style="margin-top:var(--s1)">${f.card_last4
          ? `▭ ${(f.card_brand||'Card').replace(/^./,c=>c.toUpperCase())} ending ${f.card_last4}`
          : `<span style="color:var(--clay);font-weight:600">No card on file — visits cannot be charged</span>`}</div>
        <div class="chips">${planTag}</div>
      </div></div>`;
  });
  html += `</div>`;
  $('#view-families').innerHTML = html;
}

function renderSchedule(){
  const today = todayLocal();
  const vis = [...state.visits].filter(v=>v.status!=='cancelled')
    .sort((a,b)=> (a.visit_date||'zzzz').localeCompare(b.visit_date||'zzzz') || (minsOfDay(a.visit_time) - minsOfDay(b.visit_time)));
  let html = `<button class="sched-add" onclick="openScheduler()">＋ Schedule a visit</button>`;
  if(!vis.length){ html += `<div class="panel"><div class="empty"><b>No visits scheduled</b>Match a Mom, then schedule their visits here.</div></div>`; }

  // FN-1: a visit whose date has passed is not "upcoming". Split the list so
  // nothing sits at the top of the page wearing an Upcoming badge for a week.
  const isOpen = v => (v.status==='upcoming' || v.status==='confirmed');
  const groups = [
    ['Needs attention', vis.filter(v=> v.visit_date && v.visit_date <  today &&  isOpen(v)),
     'These dates have passed. Mark them done, or cancel them.'],
    ['Today',           vis.filter(v=> v.visit_date === today), ''],
    ['Upcoming',        vis.filter(v=> !v.visit_date || v.visit_date > today), ''],
    ['Done',            vis.filter(v=> v.visit_date && v.visit_date <  today && !isOpen(v)), ''],
  ];

  groups.forEach(([title,list,note])=>{
    if(!list.length) return;
    const overdue = (title === 'Needs attention');
    html += `<div class="daygroup"><div class="dayhead">${title} <span>${list.length} visit${list.length===1?'':'s'}</span></div>`;
    if(note) html += `<div style="color:var(--muted);font-size:var(--t-sm);margin:2px 0 10px">${note}</div>`;
    list.forEach(v=>{
      const mom = state.moms.find(m=>m.id===v.mom_id);
      const open = isOpen(v);
      html += `<div class="visit">
        <div class="vtime">${v.visit_time||'—'}</div>
        <div class="vpair"><div><b>${mom?momName(mom):'—'}</b><span class="arrow">→</span>${famName(v.family_id)}</div>
          <div class="vt">${v.visit_date?fmtDay(v.visit_date)+' · ':''}${esc(arr(v.areas).join(' · '))}${v.hours?(' · '+v.hours+' hrs'):''}${v.hours?(' · $'+Math.round(v.hours*visitRate(v))):''}</div>
          ${v.checked_in_at?`<div class="vt" style="color:var(--pine)">✓ On site ${clockTime(v.checked_in_at)}${v.checked_out_at?(' – '+clockTime(v.checked_out_at)+' · '+actualHours(v)+' hrs'):' · still there'}</div>`:''}
          ${taskLine(v.id)}
          ${reviewLine(v.id)}
          ${v.payment_status==='paid' ? (v.transferred_at
             ? `<div class="vt" style="color:var(--pine)">Marm paid $${((v.payout_cents||0)/100).toFixed(2)} · ${fmtDay(v.transferred_at)}</div>`
             : `<div class="vt"><b>$${(owedFor(v)/100).toFixed(2)} owed to her</b>
                 <button class="minibtn" style="margin-left:var(--s2)" onclick="sendPayout('${v.id}', this)">Send</button>
                 ${v.payout_error?`<span style="color:var(--clay)"> · ${esc(v.payout_error)}</span>`:''}</div>`) : ''}</div>
        <div style="display:flex;flex-direction:column;gap:7px;align-items:flex-end">
          <span class="pill ${overdue?'late':(v.status==='completed'||v.status==='confirmed'?'good':'wait')}">${overdue?'Overdue':v.status.charAt(0).toUpperCase()+v.status.slice(1)}</span>
          ${v.payment_status==='paid'     ? `<span class="pill good">Paid $${((v.amount_cents||0)/100).toFixed(0)}</span>` : ''}
          ${v.payment_status==='refunded' ? `<span class="pill wait">Refunded</span>` : ''}
          ${v.payment_status==='needs_auth' ? `<span class="pill wait" title="Her bank asked her to approve it — she has a button in her app">Waiting on her bank</span>` : ''}
          ${v.payment_status==='failed'   ? `<span class="pill late" title="${(v.payment_error||'').replace(/"/g,'')}">Card declined</span>` : ''}
          ${v.payment_status==='paid'     ? `<button class="minibtn" onclick="refundVisit('${v.id}')">Refund</button>` : ''}
          ${v.payment_status==='failed'   ? `<button class="minibtn done" onclick="retryCharge('${v.id}')">Try the card again</button>` : ''}
          ${open ? `<button class="minibtn done" onclick="completeVisit('${v.id}')">✓ Mark done</button>
                    <button class="minibtn" onclick="opResched('${v.id}')">Reschedule</button>
                    <button class="minibtn" onclick="opCancel('${v.id}')">Cancel</button>` : ''}
        </div>
      </div>`;
      // FN-2: no Cancel on a visit that already happened — it has been paid for.
    });
    html += `</div>`;
  });
  $('#view-schedule').innerHTML = html;
}

let activeReqId=null;

/* ================= MATCHING =================
   Scores a Marm against a request on three things the console previously
   displayed but never compared: the work, the time of day, and how far she
   said she would travel. Nothing is hidden — a poor fit is still offered,
   but the reasons why are spelled out and it sorts to the bottom.        */

// Request windows are free text ("Weekday mornings", "Fri afternoons",
// "Weekday 3-6pm"). Pull the parts of day out of whatever was written.
function windowParts(text){
  const t = (text||'').toLowerCase();
  const out = new Set();
  if(/morning/.test(t)) out.add('Mornings');
  if(/afternoon/.test(t)) out.add('Afternoons');
  if(/evening|night/.test(t)) out.add('Evenings');
  // Clock times, including ranges where only the end carries the meridiem:
  // "3-6pm" means 3pm to 6pm, which spans afternoon AND evening.
  const bucket = h => h < 12 ? 'Mornings' : (h < 17 ? 'Afternoons' : 'Evenings');
  const to24 = (n, ap) => {
    let h = parseInt(n, 10);
    if(ap === 'pm' && h < 12) h += 12;
    if(ap === 'am' && h === 12) h = 0;
    return h;
  };
  // ranges first: 3-6pm, 9am-1pm, 3:30-6pm
  const ranges = [...t.matchAll(/(\d{1,2})(?::\d{2})?\s*(am|pm)?\s*[-–to]+\s*(\d{1,2})(?::\d{2})?\s*(am|pm)/g)];
  ranges.forEach(([,h1,ap1,h2,ap2])=>{
    const end = to24(h2, ap2);
    const start = to24(h1, ap1 || ap2);   // "3-6pm" -> the 3 is pm too
    for(let h = start; h <= end; h++) out.add(bucket(h));
  });
  // then any standalone times not already covered
  if(!ranges.length){
    (t.match(/(\d{1,2})\s*(?:[:.]\d{2})?\s*(am|pm)/g) || []).forEach(c=>{
      out.add(bucket(to24(parseInt(c,10), /pm/.test(c) ? 'pm' : 'am')));
    });
  }
  return [...out];
}

// How far she said she'd travel, in miles. The form asks in minutes because
// that is how people think about a commute; these are minutes at roughly
// 25mph of in-town driving. Deliberately generous — this is used to warn,
// not to exclude.
const TRAVEL_MILES = {
  'My neighborhood only': 3,
  'Up to 15 minutes':     6,
  'Up to 30 minutes':    12,
  'Up to 45 minutes':    20
};

// Coordinates come from three places, best first: what she shared with the
// location button, then the cached centre of her postcode, then nothing.
// Anyone who typed a ZIP rather than sharing a location lands on the second,
// which is why that cache exists at all.
function coordsOf(x){
  if(!x) return null;
  if(x.lat != null && x.lng != null) return { lat: Number(x.lat), lng: Number(x.lng) };
  if(x.zip){
    const z = (state.zips||[]).find(r=>r.zip === x.zip);
    if(z && z.lat != null && z.lng != null) return { lat: Number(z.lat), lng: Number(z.lng), approx: true };
  }
  return null;
}

// Miles between a Marm and a household, or null when we genuinely cannot
// say. Null must never read as "close" or as "far" — everyone who signed up
// before we asked for a location has no coordinates at all.
function milesApart(m, fam){
  const a = coordsOf(m), b = coordsOf(fam);
  if(!a || !b) return null;
  const R = 3958.7613, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.asin(Math.sqrt(h)) * 10) / 10;
}

// Both scales count flights of stairs, so they compare directly.
const FLIGHTS    = { 'No stairs':0, 'One flight':1, 'Two or more':2 };
const WILL_CLIMB = { "I'd rather avoid stairs":0, 'One flight is fine':1, 'Stairs are fine':2 };

function homeLine(f){
  const bits = [f.home_type, f.stairs, f.household].filter(Boolean);
  return bits.length ? bits.map(esc).join(' · ') : '';
}

function scoreMatch(m, req, fam){
  const reqAreas = arr(req.areas);
  const momAreas = arr(m.areas);
  const hits = reqAreas.filter(a=>momAreas.includes(a));

  const wanted = windowParts(req.preferred_window);
  const hers   = arr(m.times_available);
  const timeHits = wanted.filter(w=>hers.includes(w));

  // Distance, when we know it. Falls back to comparing the neighbourhood
  // labels for anyone who signed up before we asked where they were.
  const miles     = milesApart(m, fam);
  // Postcode centres are a coarser answer than a shared location, and the
  // wording should admit it rather than quote 3.2 miles like a measurement.
  const approx    = !!((coordsOf(m)||{}).approx || (coordsOf(fam)||{}).approx);
  const willGo    = TRAVEL_MILES[m.travel_radius] ?? null;
  const sameMkt   = !!(fam && m.market_id && fam.market_id && m.market_id === fam.market_id);
  const crossMkt  = !!(fam && m.market_id && fam.market_id && m.market_id !== fam.market_id);
  const sameHood  = fam && m.neighborhood && fam.neighborhood
                  && m.neighborhood.trim().toLowerCase() === fam.neighborhood.trim().toLowerCase();
  const hoodOnly  = /neighborhood only/i.test(m.travel_radius||'');

  const good = [], warn = [];

  if(reqAreas.length){
    if(hits.length === reqAreas.length) good.push(`Covers all ${reqAreas.length} area${reqAreas.length===1?'':'s'}`);
    else if(hits.length)                warn.push(`Covers ${hits.length} of ${reqAreas.length} areas — not ${reqAreas.filter(a=>!momAreas.includes(a)).join(', ')}`);
    else                                warn.push('None of the areas they asked for');
  }

  if(wanted.length){
    if(timeHits.length) good.push(`Free ${timeHits.join(' and ').toLowerCase()}`);
    else                warn.push(`Works ${hers.join(', ').toLowerCase() || 'unknown hours'} — they asked for ${wanted.join(' and ').toLowerCase()}`);
  }

  // Stairs. Portland is full of triple-deckers, and most Marms are past
  // sixty. Sending a woman who said she'd rather avoid stairs to a third-floor
  // walk-up twice a week is how you lose her — so this is scored heavily and
  // said plainly rather than left for the first visit to discover.
  const flights = FLIGHTS[(fam && fam.stairs) || ''] ?? null;
  const willDo  = WILL_CLIMB[m.stairs_ok || ''] ?? null;
  let stairsGap = 0;
  if(flights !== null && willDo !== null){
    if(flights > willDo){
      stairsGap = flights - willDo;
      warn.push(`${esc(fam.stairs)} to their door — she said "${esc(m.stairs_ok)}"`);
    } else if(flights > 0){
      good.push(`Fine with the ${fam.stairs.toLowerCase()}`);
    }
  } else if(flights === null && m.stairs_ok){
    warn.push('They have not said how many stairs — worth asking before you match');
  }

  // A Marm in another metro is not a near miss, it is the wrong person.
  let farGap = 0;
  if(crossMkt){
    const her = marketById(m.market_id), theirs = marketById(fam.market_id);
    warn.push(`Different market — she's in ${esc(her?her.name:'another city')}, they're in ${esc(theirs?theirs.name:'another city')}`);
    farGap = 99;
  } else if(miles !== null){
    if(willGo === null){
      good.push(`${approx?'about ':''}${miles} miles away`);
    } else if(miles <= willGo){
      good.push(`${approx?'about ':''}${miles} miles away — inside the ${m.travel_radius.toLowerCase()} she'll travel`);
    } else {
      farGap = miles - willGo;
      warn.push(`${approx?'about ':''}${miles} miles away — she said ${m.travel_radius.toLowerCase()}`);
    }
  } else if(sameHood){
    good.push(`Same neighborhood — ${esc(m.neighborhood)}`);
  } else if(hoodOnly){
    warn.push(`Travels her neighborhood only (${esc(m.neighborhood||'—')}) — they're in ${esc(fam?fam.neighborhood:'—')}`);
  } else if(m.travel_radius){
    good.push(`Travels ${esc(m.travel_radius.toLowerCase())}`);
    if(!coordsOf(m) || !coordsOf(fam)) warn.push('No location on file for one of them — distance not checked');
  }
  if(miles === null && !crossMkt && (!coordsOf(m) || !coordsOf(fam))){
    // Said once, plainly, rather than letting a silent null read as "nearby".
    if(!warn.some(w=>/distance not checked/.test(w))) warn.push('No location on file for one of them — distance not checked');
  }

  // Weighting: the work matters most, then the hours, then distance.
  const score = (hits.length * 10)
              + (timeHits.length * 6)
              + (sameHood ? 4 : 0)
              + (sameMkt ? 3 : 0)
              - (hoodOnly && !sameHood && miles === null ? 8 : 0)
              - (farGap * 2)                    // beyond what she agreed to travel
              - (stairsGap * 12)                // a body limit, not a preference
              - (momFamilyCount(m.id) * 0.5);   // spread the load

  return { hits, good, warn, score };
}

function openMatch(rid){
  activeReqId = rid;
  const r = state.requests.find(x=>x.id===rid);
  $('#drTitle').textContent = famName(r.family_id);
  $('#drSub').textContent = `${r.frequency||''} · ${r.preferred_window||''} · ${arr(r.areas).join(', ')}`;
  const reqAreas = arr(r.areas);
  const fam = famById(r.family_id);
  const cands = activeMoms()
    .map(m => ({ m, ...scoreMatch(m, r, fam) }))
    .sort((a,b) => b.score - a.score);

  $('#drBody').innerHTML = cands.length ? cands.map(({m,good,warn})=>{
    const fc = momFamilyCount(m.id);
    const clean = warn.length === 0;
    return `<div class="cand${clean?'':' imperfect'}">
      <div class="cand-top">
        <div class="avatar">${initials(momNameRaw(m))}</div>
        <div class="cinfo"><b>${momName(m)}</b><div class="cm">${m.rating?('★ '+Number(m.rating).toFixed(1)+' · '):''}${esc(m.neighborhood||'')} · ${fc} Mom${fc===1?'':'s'} now</div></div>
      </div>
      <div class="fitlist">
        ${good.map(g=>`<div class="fitrow ok">✓ ${g}</div>`).join('')}
        ${warn.map(w=>`<div class="fitrow no">! ${w}</div>`).join('')}
      </div>
      <div class="chips" style="margin:var(--s3) 0">${reqAreas.map(t=>`<span class="tag ${arr(m.areas).includes(t)?'hit':''}">${t}</span>`).join('')}</div>
      <button class="act ${clean?'honey':'ghost'}" onclick="pickMom('${m.id}')">
        ${clean ? `Match ${m.first_name} with ${famName(r.family_id)}` : `Match anyway — ${warn.length} mismatch${warn.length===1?'':'es'}`}
      </button>
    </div>`;
  }).join('') : `<div class="empty"><b>No active Marms yet</b>Approve a Marm in the Marms tab first.</div>`;
  $('#scrim').classList.add('open'); $('#drawer').classList.add('open');
}
function setSheetTime(v){ const el=document.getElementById('shTime'); if(el) el.value=v; }
function setTime(v){ const el=$('#svTime'); if(el){ el.value=v; el.dispatchEvent(new Event('input',{bubbles:true})); } showSeriesEnd(); }

// Visit times are stored the way they read — "9:00a", "1:00p". Sorting those
// as strings puts 1:00p before 10:00a before 8:00a, so an early visit sat
// below an afternoon one every day. Sort on minutes instead.
/* ---- Paying the Marms ------------------------------------------------
   A visit the Mom has paid for is money Marmee is holding on someone
   else's behalf. Until it is sent it is a liability, not revenue, and the
   console should say so in those terms. */
const FALLBACK_MARM_RATE = 30;   // dollars per hour to her, if the visit has none

// What she is owed is hours times her rate — not a slice of what the Mom
// paid. The two are different numbers and only one of them is a promise.
const marmRateOf = v => (v && v.marm_rate != null) ? Number(v.marm_rate) : FALLBACK_MARM_RATE;
const owedFor = v => (v.payment_status === 'paid' && !v.transferred_at)
  ? Math.round((Number(v.hours)||0) * marmRateOf(v) * 100) : 0;

function owedByMarm(){
  const by = {};
  (state.visits||[]).forEach(v=>{
    const c = owedFor(v);
    if(!c || !v.mom_id) return;
    (by[v.mom_id] = by[v.mom_id] || { cents:0, visits:[] });
    by[v.mom_id].cents += c;
    by[v.mom_id].visits.push(v);
  });
  return by;
}

function payoutLine(m){
  if(m.payouts_enabled) return '<span style="color:var(--pine)">✓ Set up for payouts</span>';
  if(m.stripe_account_id) return `<span style="color:var(--clay);font-weight:600">Payouts not finished${m.payouts_needs?(' — '+esc(m.payouts_needs)):''}</span>`;
  return '<span style="color:var(--clay);font-weight:600">No payout account yet</span>';
}

async function sendPayout(visitId, btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  try{
    const { data:{ session } } = await db.auth.getSession();
    const r = await fetch('/api/payout-visit', {
      method:'POST', headers:{'content-type':'text/plain'},
      body: JSON.stringify({ token: session && session.access_token, visitId })
    });
    const out = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(out.error || 'That did not work.');
    await loadAll(); renderAll();
    toast(out.status === 'already_paid' ? 'Already sent' : `Sent $${(out.amountCents/100).toFixed(2)}`);
  }catch(e){
    toast(e.message || 'Could not send that payout.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Send'; }
  }
}

async function checkPayoutStatus(momId){
  try{
    const { data:{ session } } = await db.auth.getSession();
    const r = await fetch('/api/connect-status', {
      method:'POST', headers:{'content-type':'text/plain'},
      body: JSON.stringify({ token: session && session.access_token, momId })
    });
    const out = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(out.error || 'Could not check.');
    await loadAll(); renderAll();
    toast(out.ready ? 'She is ready to be paid' : (out.needs || 'Not ready yet'));
  }catch(e){ toast(e.message || 'Could not check her payout status.'); }
}

// Both member apps write these and the console has never shown either. A
// rating you cannot see is worse than no rating: it tells the person who left
// it that someone is listening, and nobody is.
const tasksFor  = vid => (state.tasks||[]).filter(t=>t.visit_id===vid);
const reviewsFor= vid => (state.reviews||[]).filter(r=>r.visit_id===vid);

function taskLine(vid){
  const t = tasksFor(vid);
  if(!t.length) return '';
  const done = t.filter(x=>x.done).length;
  const undone = t.filter(x=>!x.done).map(x=>x.label);
  return `<div class="vt">${done} of ${t.length} done${undone.length?(' · not done: '+esc(undone.join(', '))):''}</div>`;
}

function reviewLine(vid){
  const rs = reviewsFor(vid);
  if(!rs.length) return '';
  return rs.map(r=>{
    const who = r.reviewer_role === 'mom' ? 'Marm' : 'Mom';
    const n = Number(r.rating)||0;
    const low = n > 0 && n <= 3;
    return `<div class="vt" style="${low?'color:var(--clay);font-weight:600':''}">${who} rated ${'★'.repeat(n)}${'☆'.repeat(Math.max(0,5-n))}${r.comment?(' — '+esc(r.comment)):''}</div>`;
  }).join('');
}

// A low rating is the one thing here that needs you today rather than in a
// weekly review, so it is surfaced on the overview, not buried in a visit.
function lowRatings(){
  return (state.reviews||[]).filter(r=>Number(r.rating)>0 && Number(r.rating)<=3);
}

// Hours she actually worked, from the check-in and check-out stamps.
// Null means she did not use them — which must not read as zero.
function actualHours(v){
  if(!v || !v.checked_in_at || !v.checked_out_at) return null;
  const mins = (new Date(v.checked_out_at) - new Date(v.checked_in_at)) / 60000;
  if(!isFinite(mins) || mins <= 0) return null;
  return Math.round((mins / 60) * 4) / 4;      // nearest quarter hour
}
function clockTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return isNaN(d) ? '' : d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function minsOfDay(t){
  if(!t) return 9999;                       // unscheduled sinks to the bottom
  const m = String(t).trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])?/);
  if(!m) return 9999;
  let h = Number(m[1]) % 12;
  if(m[3] === 'p') h += 12;
  if(!m[3] && Number(m[1]) === 12) h = 12;  // bare "12:00" reads as noon
  return h * 60 + Number(m[2] || 0);
}

// Turn 24h "09:00" into "9:00a" for display, matching how visits read elsewhere.
function to12h(v){
  if(!v) return null;
  const [H,M] = v.split(':').map(Number);
  const ampm = H < 12 ? 'a' : 'p';
  const h12  = H % 12 === 0 ? 12 : H % 12;
  return `${h12}:${String(M).padStart(2,'0')}${ampm}`;
}

// "4 visits · through Sep 10" — so a number means something.
function showSeriesEnd(){
  const hint=$('#svCountHint'); if(!hint) return;
  const rep=($('#svRepeat')||{}).value||'one';
  const n=parseInt(($('#svCount')||{}).value||'1',10);
  const d0=($('#svDate')||{}).value;
  if(rep==='one' || !d0 || !n){ hint.textContent=''; return; }
  const step = rep==='biweekly' ? 14 : 7;
  const end = new Date(new Date(d0+'T12:00:00').getTime() + (n-1)*step*86400000);
  const weeks = Math.round((n-1)*step/7);
  hint.textContent = `${n} visit${n===1?'':'s'} · through ${end.toLocaleDateString('en-US',{month:'short',day:'numeric'})} · about ${weeks} week${weeks===1?'':'s'}`;
}

}

async function confirmMatch(){
  const mid = window.__pickMid;
  const r = state.requests.find(x=>x.id===activeReqId);
  const m = state.moms.find(x=>x.id===mid);
  const date = $('#svDate').value || null;
  if(!date){ toast('Pick a date for the first visit.'); return; }
  const rawTime = ($('#svTime').value||'').trim();
  if(!rawTime){ toast('Pick a time — the Marm needs to know when to arrive.'); return; }
  const time = to12h(rawTime);
  const hours = parseFloat($('#svHours').value) || 3;
  closeDrawer();
  try{
    await must(db.from('matches').insert({ request_id:r.id, mom_id:mid, family_id:r.family_id, status:'active' }), 'Recording the match');
    await must(db.from('requests').update({ status:'matched' }).eq('id', r.id), 'Closing the request');
    const rep=($('#svRepeat')||{}).value||'one', cnt=($('#svCount')||{}).value||1;
    const dts=genDates(date,rep,cnt); const sid=(dts.length>1&&window.crypto&&crypto.randomUUID)?crypto.randomUUID():null;
    for(const dt of dts){ await must(db.from('visits').insert({ mom_id:mid, family_id:r.family_id, areas:arr(r.areas), hours, rate:rateFor(famById(r.family_id)), visit_date:dt, visit_time:time, status:'upcoming', series_id:sid }), 'Booking the visit'); }
    await loadAll(); renderAll();
    toast(`${m.first_name} matched with ${famNameRaw(r.family_id)}${date?(' · '+fmtDay(date)):''}`);
  }catch(e){ toast('Could not save the match. Did the access rules run?'); }
}
