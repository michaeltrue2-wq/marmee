# The book.hiremarmee.com site has base directory `family`, so Netlify reads
# THIS file rather than one at the repo root, and resolves paths from here.
#
# The functions live on this site because the Mom's card form does. The
# console calls stripe-charge-visit cross-origin; CORS headers are set in
# netlify/functions/_shared.js.

[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Runs every fifteen minutes. The function itself decides whether to send:
# at most one email per conversation every six hours, except the 13:00 UTC
# run (about 9am in Maine) which sweeps up anything still waiting.
# Cron is UTC — Netlify does not do local time.
[functions."notify-messages"]
  schedule = "*/15 * * * *"
