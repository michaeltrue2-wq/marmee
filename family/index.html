<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marmee — Your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>  /* ---- Design tokens (audit SP-1…4, TY-1…3) -----------------------------
     One 4pt spacing scale and one type scale. Before this there were 27
     distinct spacing values (66% off any grid) and 43 font sizes. Add new
     values here rather than inline, or the drift comes straight back.        */
  :root{
    --s1:4px;  --s2:8px;   --s3:12px; --s4:16px; --s5:20px;
    --s6:24px; --s7:32px;  --s8:40px; --s9:48px; --s10:64px;
    --t-xs:12px;  --t-sm:14px;  --t-md:16px;  --t-lg:18px; --t-xl:20px;
    --t-2xl:24px; --t-3xl:30px; --t-4xl:36px; --t-5xl:48px;
  }


  :root{--pine:#1E3A2E;--pine-deep:#152A21;--ivory:#F6F1E7;--ivory-dim:#EBE3D3;--honey:#C8993A;--honey-soft:#E4B968;--honey-deep:#806116;--blush:#E6C6B4;--ink:#15201A;--muted:#5C6B60;--line:#E0D8C6;--clay:#9D4526}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--ivory);color:var(--ink);font-size:var(--t-md);line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;line-height:1.14;letter-spacing:-.01em}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--honey-soft);display:inline-block}
  .wrap{max-width:560px;margin:0 auto;padding:var(--s6) var(--s5) var(--s10)}
  /* gate */
  .gate{position:fixed;inset:0;z-index:200;background:var(--pine);display:flex;align-items:center;justify-content:center;padding:var(--s5)}
  .gate.hidden{display:none}
  .gate-card{background:var(--ivory);border-radius:22px;padding:var(--s7) var(--s6);width:100%;max-width:420px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
  .gate-logo{font-family:'Fraunces',serif;font-size:var(--t-2xl);font-weight:600;color:var(--pine);display:flex;align-items:center;gap:var(--s2);margin:var(--s1)}
  .gate-sub{color:var(--muted);font-size:var(--t-md);margin:var(--s5)}
  .gate label{display:block;font-weight:600;font-size:var(--t-md);margin:var(--s2)}
  .gate input{width:100%;padding:var(--s3) var(--s4);border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:var(--t-md);margin:var(--s4);background:#fff}
  .gate input:focus{outline:2px solid var(--honey-soft);border-color:var(--honey)}
  .gate-btn{width:100%;background:var(--honey);color:var(--pine-deep);border:none;padding:var(--s4);border-radius:100px;font-weight:700;font-size:var(--t-md);cursor:pointer;min-height:52px}
  .gate-btn:hover{background:var(--honey-soft)}
  .gate-err{display:none;color:var(--clay);font-weight:600;font-size:var(--t-sm);text-align:center;margin:var(--s3)}
  .gate-apply{margin:var(--s5);padding:var(--s4);border-top:1px solid var(--ivory-dim);text-align:center;font-size:var(--t-md);color:var(--muted)}
  .gate-apply a{color:var(--honey-deep);font-weight:700;text-decoration:none}.gate-apply a:hover{text-decoration:underline}
  /* app */
  .app{display:none}.app.on{display:block}
  .hdr{display:flex;align-items:center;gap:var(--s3);margin:var(--s2)}
  .ava{width:50px;height:50px;border-radius:50%;background:var(--pine);color:var(--honey-soft);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:var(--t-xl);flex-shrink:0}
  .hdr .greet{font-family:'Fraunces',serif;font-size:var(--t-2xl);color:var(--pine)}
  .hdr .sub{color:var(--muted);font-size:var(--t-sm)}
  .section-t{font-size:var(--t-sm);letter-spacing:.1em;text-transform:uppercase;color:var(--honey-deep);font-weight:700;margin:var(--s6) 0 var(--s3)}
  .hero{background:var(--pine);color:var(--ivory);border-radius:22px;padding:var(--s5);position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(228,185,104,.16),transparent 68%)}
  .hero .hk{font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--honey-soft);font-weight:700;margin:var(--s3)}
  .hero h2{font-size:var(--t-3xl);font-weight:500;color:var(--ivory);position:relative}
  .hero .sub2{color:rgba(246,241,231,.8);margin:var(--s1);position:relative}
  .momcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:var(--s5);display:flex;gap:var(--s4);align-items:center}
  .momcard .mava{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,var(--blush),var(--honey-soft));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--pine-deep);font-size:var(--t-xl);flex-shrink:0}
  .momcard b{font-size:var(--t-lg);color:var(--pine)}.momcard .mm{color:var(--muted);font-size:var(--t-sm)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin:var(--s2)}
  .tag{font-size:var(--t-xs);background:var(--ivory);border:1px solid var(--line);color:var(--pine);padding:var(--s1) var(--s2);border-radius:100px;font-weight:500}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:var(--s4) var(--s5);margin:var(--s3)}
  .visit{display:flex;gap:var(--s3);align-items:flex-start}
  .visit .vt{font-family:'Fraunces',serif;font-weight:600;color:var(--pine);width:64px;flex-shrink:0}
  .visit b{font-size:var(--t-md)}.visit .vm{color:var(--muted);font-size:var(--t-sm);margin:var(--s1)}
  .pill{font-size:var(--t-xs);font-weight:700;padding:var(--s1) var(--s3);border-radius:100px}
  .pill.up{background:rgba(200,153,58,.18);color:var(--honey-deep)}.pill.good{background:rgba(30,58,46,.1);color:var(--pine)}
  .prow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:var(--s4) var(--s4);margin:var(--s3);display:flex;align-items:center;gap:var(--s3);cursor:pointer}
  .prow:hover{border-color:var(--honey)}.prow .pic{font-size:var(--t-xl);width:26px;text-align:center}
  .prow .pl{flex:1}.prow .pl b{display:block}.prow .pl span{color:var(--muted);font-size:var(--t-sm)}
  .prow .arr{color:var(--muted)}
  .req{color:var(--muted);font-size:var(--t-md)}
  .buildtag{position:fixed;bottom:6px;right:9px;font-size:var(--t-xs);color:var(--honey-deep);opacity:.5;font-family:monospace;z-index:9999}

  .chat{position:fixed;inset:0;z-index:300;background:var(--ivory);display:none;flex-direction:column}
  .chat.on{display:flex}
  .chat-head{background:var(--pine);color:var(--ivory);padding:var(--s4) var(--s4);display:flex;align-items:center;gap:var(--s3);font-family:'Fraunces',serif;font-size:var(--t-lg);font-weight:600;flex-shrink:0}
  .chat-back{background:rgba(246,241,231,.15);border:none;color:var(--ivory);width:34px;height:34px;border-radius:50%;font-size:var(--t-xl);cursor:pointer}
  .chat-msgs{flex:1;overflow-y:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
  .chat-empty{color:var(--muted);text-align:center;margin:auto;font-size:var(--t-md)}
  .bubble{max-width:78%;padding:var(--s3) var(--s4);border-radius:18px;font-size:var(--t-md);line-height:1.4;word-break:break-word;white-space:pre-wrap}
  .bubble.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
  .bubble.me{background:var(--pine);color:var(--ivory);align-self:flex-end;border-bottom-right-radius:5px}
  .chat-foot{display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--line);background:#fff;flex-shrink:0}
  .chat-foot input{flex:1;padding:var(--s3) var(--s4);border:1.5px solid var(--line);border-radius:100px;font-family:inherit;font-size:var(--t-md);background:var(--ivory);color:var(--ink)}
  .chat-foot input:focus{outline:2px solid var(--honey-soft);border-color:var(--honey)}
  .chat-foot button{background:var(--honey);color:var(--pine-deep);border:none;border-radius:100px;padding:0 var(--s5);font-family:inherit;font-weight:700;cursor:pointer}

  .chat.on{display:flex}
  .chat-head{background:var(--pine);color:var(--ivory);padding:var(--s4) var(--s4);display:flex;align-items:center;gap:var(--s3);font-family:'Fraunces',serif;font-size:var(--t-lg);font-weight:600;flex-shrink:0}
  .chat-back{background:rgba(246,241,231,.15);border:none;color:var(--ivory);width:34px;height:34px;border-radius:50%;font-size:var(--t-xl);cursor:pointer}
  .chat-msgs{flex:1;overflow-y:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
  .chat-empty{color:var(--muted);text-align:center;margin:auto;font-size:var(--t-md)}
  .bubble{max-width:78%;padding:var(--s3) var(--s4);border-radius:18px;font-size:var(--t-md);line-height:1.4;word-break:break-word;white-space:pre-wrap}

  .chat-foot{display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--line);background:#fff;flex-shrink:0}
  .chat-foot input{flex:1;padding:var(--s3) var(--s4);border:1.5px solid var(--line);border-radius:100px;font-family:inherit;font-size:var(--t-md);background:var(--ivory);color:var(--ink)}
  .chat-foot input:focus{outline:2px solid var(--honey-soft);border-color:var(--honey)}
  .chat-foot button{background:var(--honey);color:var(--pine-deep);border:none;border-radius:100px;padding:0 var(--s5);font-family:inherit;font-weight:700;cursor:pointer}
  .actbtn{background:var(--ivory);border:1px solid var(--line);color:var(--pine);border-radius:100px;padding:var(--s1) var(--s3);font-family:inherit;font-size:var(--t-xs);font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .actbtn:hover{border-color:var(--honey)}
  .actbtn.warn{color:var(--clay)}
  .vacts{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s3)}
  .checklist{margin:var(--s3);border-top:1px solid var(--ivory-dim);padding:var(--s3)}
  .checklist .ct{font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:var(--s2)}
  .task{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0;font-size:var(--t-md)}
  .task input[type=checkbox]{width:18px;height:18px;accent-color:var(--pine)}
  .task.done label{text-decoration:line-through;color:var(--muted)}
  .task-add{display:flex;gap:var(--s2);margin:var(--s2)}
  .task-add input{flex:1;padding:var(--s2) var(--s3);border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:var(--t-sm);background:#fff}
  .task-add button{background:var(--pine);color:var(--ivory);border:none;border-radius:9px;padding:0 var(--s3);font-family:inherit;font-weight:600;font-size:var(--t-sm);cursor:pointer}
  .bookbtn{background:var(--honey);color:var(--pine-deep);border:none;border-radius:100px;padding:var(--s3) var(--s5);font-family:inherit;font-weight:700;cursor:pointer;margin:var(--s3)}
  .bookbtn:hover{background:var(--honey-soft)}
  .bookform{background:#fff;border:1px solid var(--line);border-radius:16px;padding:var(--s4);margin:var(--s4)}
  .bookform label{display:block;font-weight:600;font-size:var(--t-sm);margin:0 0 var(--s1);color:var(--pine)}
  .bookform input{width:100%;padding:var(--s3) var(--s3);border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:var(--t-md);background:#fff;margin:var(--s3)}
  .bookform .bookgo{background:var(--pine);color:var(--ivory);border:none;border-radius:100px;padding:var(--s3);width:100%;font-family:inherit;font-weight:700;cursor:pointer}
  .section-t2{font-size:var(--t-sm);letter-spacing:.1em;text-transform:uppercase;color:var(--honey-deep);font-weight:700;margin:var(--s6) 0 var(--s3)}
  .stars{display:flex;gap:var(--s1);margin:var(--s1) 0 var(--s2)}
  .star{background:none;border:none;font-size:var(--t-3xl);line-height:1;color:var(--line);cursor:pointer;padding:0}
  .star.on{color:var(--honey-deep)}
  .stars-ro{color:var(--honey-deep);font-size:var(--t-lg);letter-spacing:2px}
  .reviewbox{margin:var(--s3);border-top:1px solid var(--ivory-dim);padding:var(--s3)}
  .rvt{font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .rev-input{width:100%;padding:var(--s2) var(--s3);border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:var(--t-sm);background:#fff;margin:var(--s2)}
  .rev-submit{background:var(--pine);color:var(--ivory);border:none;border-radius:100px;padding:var(--s2) var(--s4);font-family:inherit;font-weight:700;font-size:var(--t-sm);cursor:pointer}
  .reviewed{margin:var(--s3);border-top:1px solid var(--ivory-dim);padding:var(--s2)}
  .rev-c{color:var(--muted);font-size:var(--t-sm);font-style:italic;margin:var(--s1)}
</style>
</head>
<body>

<!-- GATE -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-logo"><span class="dot"></span>Marmee</div>
    <div class="gate-sub">Sign in to see your match and visits.</div>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')document.getElementById('pass').focus()">
    <label for="pass">Password</label>
    <input id="pass" type="password" placeholder="Your password" onkeydown="if(event.key==='Enter')login()">
    <button class="gate-btn" id="loginBtn" onclick="login()">Sign in</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-apply">Need help around the house? <a href="family-request.html">Request a Marm →</a></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app"><div class="wrap">
  <div class="hdr">
    <div class="ava" id="ava">·</div>
    <div><div class="greet" id="greet">Welcome</div><div class="sub" id="sub"></div></div>
  </div>
  <div id="body"></div>
  <div class="section-t">Your account</div>
  <div class="prow" onclick="stub('This would let you edit your request.')"><span class="pic">✎</span><div class="pl"><b>Your request</b><span id="reqSummary">—</span></div><span class="arr">›</span></div>
  <div class="prow" onclick="openMessages()"><span class="pic">💬</span><div class="pl"><b>Messages</b><span>Chat with your Marm</span></div><span class="arr">›</span></div>
  <div class="prow" onclick="signout()"><span class="pic">⏻</span><div class="pl"><b>Sign out</b></div><span class="arr">›</span></div>
</div></div>


<script>
  console.log("Marmee family-index — build 4");
  const SUPABASE_URL='https://dlargnwijzrlruaxzsgj.supabase.co';
  const SUPABASE_KEY='sb_publishable_RvdH1vqVRoxvL-gnXwGHkw_1CcRTpLg';
  let db=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
  const $=s=>document.querySelector(s);
  const arr=a=>Array.isArray(a)?a:(a?String(a).replace(/[{}"]/g,'').split(',').filter(Boolean):[]);
  const initials=t=>{const p=(t||'').replace(/^The /,'').trim().split(' ');return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'');};
  function fmtDay(d){ if(!d) return 'To be scheduled'; return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
  // Shows a gate error. Optional {href,label} renders a link beneath it —
  // built with DOM nodes, never innerHTML.
  function gerr(m, link){
    const e=$('#gateErr');
    if(!m){ e.textContent=''; e.style.display='none'; return; }
    e.textContent = m;
    if(link){
      e.appendChild(document.createElement('br'));
      const a=document.createElement('a');
      a.href=link.href; a.textContent=link.label;
      a.style.cssText='color:inherit;font-weight:700;text-decoration:underline;display:inline-block;margin-top:6px';
      e.appendChild(a);
    }
    e.style.display='block';
  }

  // ER-1: never show a raw backend string to a person.
  const AUTH_MESSAGES = {
    'Invalid login credentials':
      'That email and password don\'t match. If you just applied, check your email for a confirmation link first.',
    'Email not confirmed':
      'Almost there — tap the link in the email we sent you, then sign in.',
    'Email logins are disabled':
      'Sign-in is temporarily unavailable. Please try again shortly.',
    'User already registered':
      'There is already an account with that email. Try signing in instead.',
  };
  function friendlyAuthError(error){
    const raw = (error && error.message) || '';
    return AUTH_MESSAGES[raw]
      || 'That didn\'t work. Try again, or reply to our email and we\'ll sort it out.';
  }

  // ER-2 / ER-3: a session with no matching profile row used to be a dead end —
  // the error painted over the gate, and the only sign-out control lived inside
  // the app shell you could not reach. Sign the user out so they are never
  // trapped, and if their account belongs to the other app, say so.
  async function recoverNoProfile(uid){
    let msg = 'We couldn\'t find your account yet. If you just requested help, give it a moment — or reply to our email and we\'ll sort it out.';
    let link = null;
    try{
      const { data:other } = await db.from('moms').select('id').eq('user_id', uid);
      if(other && other.length){
        msg  = 'This looks like a Marm account, not a Mom account.';
        link = { href:'https://moms.hiremarmee.com', label:'Sign in at moms.hiremarmee.com \u2192' };
      }
    }catch(e){}
    try{ await db.auth.signOut(); }catch(e){}
    gerr(msg, link);
  }
  function stub(m){ alert(m.replace(/^This would /,'').replace(/\.$/,'')); }
  let me=null, myReqs=[], myVisits=[], momById={}, visitTasks={}, myReviews={};

  async function login(){
    if(!db){ gerr('Could not reach the server. Refresh and try again.'); return; }
    const email=$('#email').value.trim(), pass=$('#pass').value;
    if(!email||!pass){ gerr('Enter your email and password.'); return; }
    const b=$('#loginBtn'); b.textContent='Signing in…'; b.disabled=true; gerr('');
    try{
      const { data, error }=await withTimeout(
        db.auth.signInWithPassword({ email, password:pass }), 15000);
      if(error){ gerr(friendlyAuthError(error)); }
      else{ await withTimeout(enter(data&&data.user&&data.user.id), 15000); }
    }catch(e){
      gerr(e && e.message === 'timeout'
        ? 'That took too long. Check your connection and try again.'
        : 'Something went wrong. Try again.');
    }finally{
      b.textContent='Sign in'; b.disabled=false;
    }
  }

  // Never let the sign-in button hang forever on a stalled request.
  function withTimeout(p, ms){
    return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
  }
  async function signout(){ if(db) await db.auth.signOut(); location.reload(); }

  async function enter(uid){
    // uid comes from the sign-in response. Falling back to getSession() reads
    // local storage instead of calling getUser(), which can deadlock against
    // the auth lock held by signInWithPassword().
    if(!uid){
      const { data:{ session } } = await db.auth.getSession();
      uid = session && session.user && session.user.id;
    }
    if(!uid){ gerr('Your session expired. Sign in again.'); return; }
    const { data:rows, error }=await db.from('families').select('*').eq('user_id', uid);
    if(error||!rows||!rows.length){ await recoverNoProfile(uid); return; }
    me=rows[0];
    const [{data:rq},{data:vs}]=await Promise.all([
      db.from('requests').select('*').eq('family_id', me.id),
      db.from('visits').select('*').eq('family_id', me.id)
    ]);
    myReqs=rq||[]; myVisits=vs||[];
    const momIds=[...new Set(myVisits.map(v=>v.mom_id).filter(Boolean))];
    if(momIds.length){ const {data:m}=await db.from('moms').select('*').in('id', momIds); (m||[]).forEach(x=>momById[x.id]=x); }
    await loadTasks(); await loadReviews();
    $('#gate').classList.add('hidden'); $('#app').classList.add('on');
    render();
  }

  function render(){
    const nm=me.name||'there';
    $('#greet').textContent = `Hi, ${nm.replace(/^The /,'')}`;
    $('#ava').textContent = (nm.replace(/^The /,'')[0]||'·').toUpperCase();
    $('#sub').textContent = me.neighborhood ? ('Marmee · '+me.neighborhood) : 'Marmee';

    const matched = myVisits.length>0 || Object.keys(momById).length>0;
    const mom = Object.values(momById)[0];
    const upcoming = myVisits.filter(v=>v.status==='upcoming'||v.status==='confirmed')
      .sort((a,b)=>(a.visit_date||'').localeCompare(b.visit_date||''));
    let html='';

    if(mom){
      html += `<div class="section-t">Your Marm</div>
        <div class="momcard"><div class="mava">${initials((mom.first_name||'')+' '+(mom.last_initial||''))}</div>
        <div><b>${(mom.first_name||'')+' '+(mom.last_initial||'')}</b>
        <div class="mm">${mom.rating?('★ '+Number(mom.rating).toFixed(1)+' · '):''}${mom.neighborhood||''}</div>
        <div class="chips">${arr(mom.areas).map(a=>`<span class="tag">${a}</span>`).join('')}</div></div></div>`;
    } else {
      html += `<div class="hero"><div class="hk">Your match</div>
        <h2>We're finding your Marm</h2>
        <div class="sub2">We're hand-picking an experienced Marm near you. We'll be in touch soon — hang tight.</div></div>`;
    }

    html += `<div class="section-t">Upcoming visits</div>`;
    if(mom){
      html += `<button class="bookbtn" onclick="toggleBookForm()">＋ Book a visit with ${mom.first_name}</button>
        <div class="bookform" id="bookForm" style="display:none">
          <label>Date</label><input type="date" id="bkDate" min="${new Date().toISOString().slice(0,10)}">
          <label>Time</label><input type="text" id="bkTime" placeholder="9:00 AM">
          <label>Hours</label><input type="number" id="bkHours" value="3" min="1" step="0.5">
          <button class="bookgo" onclick="doBook()">Book this visit</button>
        </div>`;
    }
    if(upcoming.length){
      upcoming.forEach(v=>{
        const m=momById[v.mom_id];
        const tasks=visitTasks[v.id]||[];
        const cl = calLink(v);
        html += `<div class="card">
          <div class="visit"><div class="vt">${v.visit_time||'—'}</div>
            <div style="flex:1"><b>${fmtDay(v.visit_date)}</b>
            <div class="vm">${m?((m.first_name||'')+' '+(m.last_initial||'')+' · '):''}${v.hours?(v.hours+' hours'):''}</div>
            <div class="chips">${arr(v.areas).map(a=>`<span class="tag">${a}</span>`).join('')}</div></div>
            <span class="pill up">Upcoming</span></div>
          <div class="checklist"><div class="ct">What you'd like done</div>
            ${tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><label>${escapeH(t.label)}</label></div>`).join('')}
            <div class="task-add"><input id="task-${v.id}" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask('${v.id}')"><button onclick="addTask('${v.id}')">Add</button></div>
          </div>
          <div class="vacts">
            ${cl?`<a class="actbtn" href="${cl}" target="_blank">📅 Add to calendar</a>`:''}
            <button class="actbtn" onclick="doResched('${v.id}')">Reschedule</button>
            <button class="actbtn warn" onclick="doCancel('${v.id}')">Cancel</button>
          </div>
        </div>`;
      });
    } else {
      html += `<div class="card req">No visits scheduled yet${mom?' — book your first one above.':'. They\'ll appear here once you\'re matched.'}</div>`;
    }

    const past = myVisits.filter(v=>v.status==='completed').sort((a,b)=>(b.visit_date||'').localeCompare(a.visit_date||''));
    if(past.length){
      html += `<div class="section-t2">Past visits</div>`;
      past.forEach(v=>{
        const m=momById[v.mom_id]; const rev=myReviews[v.id];
        html += `<div class="card">
          <div class="visit"><div class="vt">${v.visit_time||'—'}</div>
            <div style="flex:1"><b>${fmtDay(v.visit_date)}</b><div class="vm">${m?((m.first_name||'')+' '+(m.last_initial||'')):''}</div></div>
            <span class="pill good">Done</span></div>
          ${rev ? `<div class="reviewed"><div class="stars-ro">${'★'.repeat(rev.rating)}${'☆'.repeat(5-rev.rating)}</div>${rev.comment?('<div class="rev-c">“'+escapeH(rev.comment)+'”</div>'):''}</div>`
                : `<div class="reviewbox"><div class="rvt">How was your visit${m?(' with '+m.first_name):''}?</div>
                     <div class="stars" id="stars-${v.id}" data-rating="0">${[1,2,3,4,5].map(n=>`<button class="star" onclick="setStar('${v.id}',${n})">★</button>`).join('')}</div>
                     <input class="rev-input" id="rev-${v.id}" placeholder="Add a note (optional)">
                     <button class="rev-submit" onclick="submitReview('${v.id}')">Submit review</button>
                   </div>`}
        </div>`;
      });
    }

    $('#body').innerHTML = html;

    const req=myReqs[0];
    $('#reqSummary').textContent = req ? (arr(req.areas).join(', ')+(req.frequency?(' · '+req.frequency):'')) : 'No request on file';
  }

  function escapeH(x){ return (x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function calLink(v){
    if(!v.visit_date) return null;
    let hh=9,mm=0; const t=(v.visit_time||'').match(/(\d{1,2}):?(\d{2})?\s*(am|pm)?/i);
    if(t){ hh=parseInt(t[1]); mm=t[2]?parseInt(t[2]):0; const ap=(t[3]||'').toLowerCase(); if(ap==='pm'&&hh<12)hh+=12; if(ap==='am'&&hh===12)hh=0; }
    const sdt=new Date(v.visit_date+'T00:00:00'); sdt.setHours(hh,mm,0,0);
    const edt=new Date(sdt.getTime()+(Number(v.hours)||3)*3600000);
    const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';
    const m=momById[v.mom_id]; const title='Marmee visit'+(m?(' with '+m.first_name):'');
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+f(sdt)+'/'+f(edt)+'&details='+encodeURIComponent('Booked through Marmee');
  }
  async function loadTasks(){
    visitTasks={}; const ids=myVisits.map(v=>v.id); if(!ids.length) return;
    try{ const {data}=await db.from('visit_tasks').select('*').in('visit_id',ids).order('created_at',{ascending:true});
      (data||[]).forEach(t=>{ (visitTasks[t.visit_id]=visitTasks[t.visit_id]||[]).push(t); }); }catch(e){}
  }
  async function reloadVisits(){
    try{ const {data:vs}=await db.from('visits').select('*').eq('family_id',me.id); myVisits=vs||[];
      const ids=[...new Set(myVisits.map(v=>v.mom_id).filter(Boolean))];
      if(ids.length){ const {data:m}=await db.from('moms').select('*').in('id',ids); (m||[]).forEach(x=>momById[x.id]=x); }
      await loadTasks(); await loadReviews(); render(); }catch(e){}
  }
  function toggleBookForm(){ const f=document.getElementById('bookForm'); f.style.display=f.style.display==='none'?'block':'none'; }
  async function doBook(){
    const mom=Object.values(momById)[0]; if(!mom){ alert('You\'ll be matched with a Marm first.'); return; }
    const date=document.getElementById('bkDate').value, time=(document.getElementById('bkTime').value||'').trim(), hours=parseFloat(document.getElementById('bkHours').value)||3;
    if(!date||!time){ alert('Pick a date and time.'); return; }
    const req=myReqs[0]; const areas=req?arr(req.areas):[];
    try{ const {error}=await db.rpc('book_visit',{p_mom:mom.id,p_date:date,p_time:time,p_hours:hours,p_areas:areas});
      if(error){ alert(error.message); return; } toggleBookForm(); await reloadVisits(); }
    catch(e){ alert('Could not book. Try again.'); }
  }
  async function doCancel(id){
    if(!confirm('Cancel this visit?')) return;
    const reason=prompt('Optional — reason for cancelling:')||'';
    try{ const {error}=await db.rpc('cancel_visit',{p_visit:id,p_reason:reason}); if(error){alert(error.message);return;} await reloadVisits(); }
    catch(e){ alert('Could not cancel.'); }
  }
  async function doResched(id){
    const date=prompt('New date (YYYY-MM-DD):'); if(!date) return;
    const time=prompt('New time (e.g. 9:00 AM):'); if(!time) return;
    try{ const {error}=await db.rpc('reschedule_visit',{p_visit:id,p_date:date,p_time:time}); if(error){alert(error.message);return;} await reloadVisits(); }
    catch(e){ alert('Could not reschedule.'); }
  }
  async function addTask(id){
    const inp=document.getElementById('task-'+id); const label=(inp.value||'').trim(); if(!label) return; inp.value='';
    try{ await db.from('visit_tasks').insert({visit_id:id,label}); await reloadVisits(); }catch(e){}
  }
  async function toggleTask(taskId,done){
    try{ await db.from('visit_tasks').update({done}).eq('id',taskId); await reloadVisits(); }catch(e){}
  }
  async function loadReviews(){
    myReviews={}; const ids=myVisits.map(v=>v.id); if(!ids.length) return;
    try{ const {data}=await db.from('reviews').select('*').in('visit_id',ids);
      (data||[]).forEach(r=>{ if(r.reviewer_role==='family') myReviews[r.visit_id]=r; }); }catch(e){}
  }
  function setStar(vid,n){
    const box=document.getElementById('stars-'+vid); box.dataset.rating=n;
    [...box.querySelectorAll('.star')].forEach((s,i)=> s.classList.toggle('on', i<n));
  }
  async function submitReview(vid){
    const box=document.getElementById('stars-'+vid); const rating=parseInt(box.dataset.rating||'0');
    if(!rating){ alert('Tap a star rating first.'); return; }
    const comment=(document.getElementById('rev-'+vid).value||'').trim();
    const v=myVisits.find(x=>x.id===vid); if(!v) return;
    try{ const {error}=await db.from('reviews').insert({visit_id:vid,family_id:me.id,mom_id:v.mom_id,reviewer_role:'family',rating,comment});
      if(error){ alert(error.message); return; } await reloadVisits(); }
    catch(e){ alert('Could not submit review.'); }
  }

  (async function(){
    if(!db){ gerr('Could not load. Refresh the page.'); return; }
    try{ const { data:{ session } }=await db.auth.getSession(); if(session){ await enter(); } }catch(e){}
  })();
</script>

<div class="chat" id="chat">
  <div class="chat-head"><button class="chat-back" onclick="closeChat()">←</button><span id="chatName">Chat</span></div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-foot">
    <input id="chatInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">Send</button>
  </div>
</div>
<script>
  function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  let chatMomId=null, chatPoll=null;
  function openMessages(){
    const mom = Object.values(momById)[0];
    if(mom) openChat(mom.id);
    else alert('You can message your Marm once you\'re matched.');
  }
  function openChat(momId){
    if(!momId) return;
    chatMomId=momId;
    const mom=momById[momId];
    document.getElementById('chatName').textContent = mom?((mom.first_name||'')+' '+(mom.last_initial||'')).trim():'Your Marm';
    document.getElementById('chat').classList.add('on');
    loadChat(); if(chatPoll)clearInterval(chatPoll); chatPoll=setInterval(loadChat,4000);
  }
  function closeChat(){ document.getElementById('chat').classList.remove('on'); if(chatPoll){clearInterval(chatPoll);chatPoll=null;} }
  async function loadChat(){
    if(!chatMomId||!me) return;
    try{
      const { data } = await db.from('messages').select('*').eq('family_id',me.id).eq('mom_id',chatMomId).order('created_at',{ascending:true});
      const box=document.getElementById('chatMsgs'); const msgs=data||[];
      box.innerHTML = msgs.length ? msgs.map(m=>'<div class="bubble '+(m.sender_role==='family'?'me':'them')+'">'+esc(m.body)+'</div>').join('') : '<div class="chat-empty">No messages yet. Say hello \ud83d\udc4b</div>';
      box.scrollTop = box.scrollHeight;
    }catch(e){}
  }
  async function sendChat(){
    const inp=document.getElementById('chatInput'); const body=(inp.value||'').trim(); if(!body||!chatMomId||!me) return;
    inp.value='';
    try{ await db.from('messages').insert({ family_id:me.id, mom_id:chatMomId, sender_role:'family', body }); await loadChat(); }
    catch(e){ inp.value=body; }
  }
</script>
</body>
